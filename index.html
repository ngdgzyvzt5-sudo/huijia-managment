function detail(id){let t=get(id),locked=t.shipments.length>0||t.recoveries.length>0;modal(`<div class="row between"><h2>${esc(state.title)}</h2>${statusBadges(t)}</div><div class="detail-number">${esc(t.number)}</div><p class="muted">申請日期：${esc(t.date)}｜申請人：${esc(t.applicant)}</p><p><b>機構：</b>${esc(t.institution)}</p><div class="line"></div><h3>維修申請</h3>${t.items.map((x,i)=>`<div class="item-row hj-detail-item"><span class="hj-detail-index">${i+1}.</span><div class="hj-detail-item-body"><div><b>${esc(x.name)}</b><span class="hj-detail-qty">× ${x.qty}</span></div><p class="muted">維修原因：${esc(x.reason||'—')}</p><p class="muted">已回收 ${recovered(t,i)}／已出貨 ${shipped(t,i)}</p></div></div>`).join('')}<p><b>備註：</b>${esc(t.note||'—')}</p><div class="notice">${locked?'此單已有出貨或回收紀錄，申請內容已鎖定。':'尚未出貨／回收，申請內容可修改。'} 回收與出貨歷史獨立保存。</div><div class="hj-detail-actions"><div class="hj-detail-action-grid"><button class="btn action-large" onclick="actionForm('${id}','ship')" ${t.items.every((x,i)=>shipped(t,i)>=x.qty)?'disabled':''}>出貨</button><button class="btn secondary action-large" onclick="actionForm('${id}','recover')" ${t.items.every((x,i)=>recovered(t,i)>=x.qty)?'disabled':''}>回收</button>${!locked?`<button class="btn outline" onclick="editTicket('${id}')">編輯</button>`:''}<button class="btn outline" onclick="exportMenu('${id}')">匯出圖檔</button>${state.receiptEnabled?`<button class="btn outline" onclick="receiptEditor('${id}')">簽收單</button>`:``}</div></div><div class="line"></div><h3>回收紀錄</h3>${history(t.recoveries,t,'回收')}<div class="line"></div><h3>出貨紀錄</h3>${history(t.shipments,t,'出貨')}${!locked&&!t.deleted?`<div class="hj-detail-delete"><button class="btn danger" onclick="repairDeleteUnprocessed('${id}')">刪除單據</button></div>`:''}`)}function history(arr,t,word){return arr.length?arr.map((h,i)=>`<div class="history"><b>第 ${i+1} 次${word}｜${esc(h.date)}</b><p style="font-size:13px">${h.lines.map(l=>`${esc(t.items[l.index]?.name||'品項')} × ${l.qty}`).join('、')}</p><p class="muted">${esc(h.note||'無備註')}</p></div>`).join(''):`<p class="muted">尚無${word}紀錄</p>`}
function actionForm(id,type){let t=get(id),isShip=type==='ship',word=isShip?'出貨':'回收';if(isShip&&t.items.every((x,i)=>shipped(t,i)>=x.qty))return alert('此單已全部出貨');if(!isShip&&t.items.every((x,i)=>recovered(t,i)>=x.qty))return alert('此單已全部回收');let available=t.items.map((x,i)=>x.qty-(isShip?shipped(t,i):recovered(t,i)));modal(`<h2>新增${word}紀錄</h2><p class="muted">維修單號：${esc(t.number)}</p><div class="notice">${isShip?'可一次出貨全部剩餘品項，也可只出貨部分數量。第一次出貨後，原始維修申請將鎖定。':'可在申請當天或日後回收；回收日期與申請日期可不同。'}</div><div class="panel"><h3>選擇${word}品項與數量</h3>${t.items.map((x,i)=>`<div class="checkrow"><div><b style="font-size:13px">${esc(x.name)}</b><p class="muted">申請 ${x.qty}｜${isShip?'尚待出貨':'尚待回收'} ${available[i]}</p></div><input id="a-${i}" type="number" min="0" max="${available[i]}" step="1" value="0" ${available[i]<=0?'disabled':''}></div>`).join('')}<button class="btn secondary small" onclick="fillAll()">整批${word}（填入全部剩餘數量）</button></div><label class="field"><span>${word}日期 *</span><input type="date" id="a-date" value="${today()}"></label><label class="field"><span>${word}備註（選填）</span><textarea id="a-note" placeholder="例如：宅配寄出／交由某位客服／現場收回"></textarea></label><button class="btn" style="width:100%" onclick="saveAction('${id}','${type}')">確認${word}</button>`)}function fillAll(){document.querySelectorAll('input[type=number][id^="a-"]').forEach(x=>{if(!x.disabled)x.value=x.max})}function saveAction(id,type){let t=get(id),isShip=type==='ship',arr=isShip?t.shipments:t.recoveries,date=document.getElementById('a-date').value,note=document.getElementById('a-note').value.trim(),lines=[];for(let i=0;i<t.items.length;i++){let el=document.getElementById('a-'+i),qty=Number(el.value),available=t.items[i].qty-(isShip?shipped(t,i):recovered(t,i));if(!Number.isInteger(qty)||qty<0||qty>available)return alert('數量必須為 0 到剩餘數量之間的整數');if(qty>0)lines.push({index:i,qty})}if(!date||!lines.length)return alert('請填寫日期，並至少選擇一個數量大於 0 的品項');arr.push({date,note,lines});save();closeModal();render();detail(id)}
function settingsProducts(){modal(`<h2>維修申請項目管理</h2><div id="productList">${state.products.map((x,i)=>`<div class="row between item-row"><span>${esc(x)}</span><button class="btn secondary small" onclick="removeProduct(${i})">停用</button></div>`).join('')}</div><label class="field"><span>新增維修品項</span><input id="newProduct" placeholder="例如：智慧光纖薄墊感測線"></label><button class="btn" onclick="addProduct()">新增品項</button><div class="notice">停用只會從未來新增維修單的下拉選單移除，不影響既有紀錄。</div>`)}function addProduct(){let v=document.getElementById('newProduct').value.trim();if(!v)return;if(state.products.includes(v))return alert('此品項已存在');state.products.push(v);save();settingsProducts()}function removeProduct(i){if(!confirm('停用此品項？舊維修單不受影響。'))return;state.products.splice(i,1);save();settingsProducts()}function settingsFormat(){modal(`<h2>維修單格式設定</h2><label class="field"><span>單據標題</span><input id="formatTitle" value="${esc(state.title)}"></label><div class="notice">單號固定顯示在右上角；每列申請格含維修品項、數量與維修原因。未出貨可編輯，出貨後鎖定。</div><button class="btn" onclick="state.title=document.getElementById('formatTitle').value.trim()||'維修申請單';save();closeModal()">儲存格式</button>`)}function settingsSync(){modal(`<h2>專屬同步碼</h2><div class="notice"><b>雲端同步尚未啟用。</b> 此畫面是正式版配對流程預覽，下面的代碼不會同步資料，請勿當作真實同步憑證。</div><p>正式版預計：第一台裝置產生高強度配對密鑰，其他手機或電腦輸入密鑰後，連接同一份雲端資料。</p><div class="code">尚未連接雲端</div><p class="muted">正式版需部署雲端資料庫、安全權限與配對機制。</p>`)}function repairDeleteUnprocessed(id){let t=get(id);if(!t||t.deleted)return;if(t.shipments.length||t.recoveries.length)return alert('已有處理紀錄，請在設定封存');if(!confirm('確定刪除 '+t.number+'？此單號可再次使用。'))return;state.tickets=state.tickets.filter(x=>x.id!==id);save();closeModal();render()}function settingsDeleted(){modal(`<h2>已處理維修單封存／查詢</h2><p class="notice">未出貨且未回收可在單據內直接刪除；已處理單據僅能在此封存，單號不回收。</p><label class="field"><span>指定維修單號</span><input id="deleteNumber" placeholder="例如：202611-001"></label><label class="field"><span>封存原因（必填）</span><input id="deleteReason" placeholder="輸入原因"></label><button class="btn danger" onclick="softDelete()">依單號封存</button><div class="line"></div><h3>已刪除單據</h3>${state.tickets.filter(t=>t.deleted).map(t=>`<div class="item-row"><b>${esc(t.number)}</b><p class="muted">${esc(t.institution)}｜${esc(t.deletedAt||'')}</p><p class="muted">原因：${esc(t.deleteReason||'')}</p><button class="btn outline small" onclick="detail('${t.id}')">查閱原始紀錄</button></div>`).join('')||'<p class="muted">尚無已刪除單據</p>'}`)}function softDelete(){let number=document.getElementById('deleteNumber').value.trim(),reason=document.getElementById('deleteReason').value.trim(),t=state.tickets.find(x=>x.number===number&&!x.deleted);if(!t)return alert('找不到此有效單號');if(!reason)return alert('請填寫封存原因');if(!t.shipments.length&&!t.recoveries.length)return alert('尚未處理的單據請從單據詳情刪除');if(!confirm('確認將 '+number+' 移至已刪除單據？資料仍會保留。'))return;t.deleted=true;t.deletedAt=new Date().toLocaleString('zh-TW');t.deleteReason=reason;save();settingsDeleted();render()}function exportBackup(){let blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});downloadBlob(blob,'滙嘉維修資料備份-'+today()+'.json')}
let currentJpgBlob=null,currentJpgName='',currentJpgUrl='';
function showJpgPreview(blob,name){
 if(currentJpgUrl)URL.revokeObjectURL(currentJpgUrl);
 currentJpgBlob=blob;currentJpgName=name;currentJpgUrl=URL.createObjectURL(blob);
 modal(`<h2>圖檔預覽｜JPG</h2><p class="muted">已生成圖片，可先確認內容，再分享或儲存到相簿。</p><div class="jpg-preview-wrap"><img class="jpg-preview-image" src="${currentJpgUrl}" alt="${esc(name)}"></div><div class="jpg-actions"><button class="btn" onclick="shareJpg()">↗ 分享圖片</button><button class="btn secondary" onclick="saveJpg()">▣ 儲存到相簿</button><button class="btn outline" onclick="downloadBlob(currentJpgBlob,currentJpgName)">↓ 下載 JPG</button></div><p class="notice">iPhone：點「分享圖片」後，在系統分享選單選「儲存影像」，即可存入「照片」App。若瀏覽器不支援直接分享圖片，請點「開啟圖片」，再長按圖片選「儲存到照片」。</p><button class="btn outline" style="width:100%" onclick="openJpgImage()">開啟圖片（備用方式）</button>`);
}
async function shareJpg(){if(!currentJpgBlob)return;let file=new File([currentJpgBlob],currentJpgName,{type:'image/jpeg'});try{if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:currentJpgName});return}if(navigator.share){await navigator.share({title:currentJpgName,url:currentJpgUrl});return}}catch(e){if(e.name==='AbortError')return;console.warn('分享失敗',e)}alert('此瀏覽器無法直接分享 JPG 檔案。請使用下方「開啟圖片」並長按圖片，或先下載 JPG 後再分享。')}
async function saveJpg(){if(!currentJpgBlob)return;let file=new File([currentJpgBlob],currentJpgName,{type:'image/jpeg'});try{if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:currentJpgName});return}}catch(e){if(e.name==='AbortError')return;console.warn('儲存分享選單失敗',e)}openJpgImage();alert('已嘗試開啟 JPG 圖片。iPhone 請長按圖片，選「儲存到照片」；電腦可按右鍵另存圖片。')}
function openJpgImage(){if(!currentJpgUrl)return;let win=window.open(currentJpgUrl,'_blank');if(!win){let img=document.querySelector('.jpg-preview-image');if(img){img.scrollIntoView({behavior:'smooth'});alert('瀏覽器阻擋新分頁。請長按預覽圖片並選擇儲存影像。')}}}
function downloadBlob(blob,name){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}function exportMenu(id){modal(`<h2>選擇圖檔格式</h2><p class="muted">申請單適合傳給客服；完整紀錄供內部追蹤。</p><div style="display:grid;gap:12px;margin-top:18px"><button class="btn action-large" onclick="downloadPng('${id}','request')">維修申請單 JPG</button><button class="btn secondary action-large" onclick="downloadPng('${id}','full')">完整維修紀錄 JPG</button>${state.receiptEnabled?`<button class="btn outline action-large" onclick="receiptEditor('${id}')">產品送貨／簽收單</button>`:``}</div>`)}
function canvasTable(title,number,sections,filename,foot='滙嘉健康生活科技股份有限公司'){let W=1120,margin=56,usable=W-margin*2,rowH=48;let measure=document.createElement('canvas').getContext('2d');measure.font='22px sans-serif';function wrap(txt,width){let words=Array.from(String(txt??''));let out=[],line='';for(let c of words){if(measure.measureText(line+c).width>width&&line){out.push(line);line=c}else line+=c}out.push(line);return out}let rows=[];for(let sec of sections){rows.push({gap:true});rows.push({head:sec.title});let widths=sec.widths||sec.columns.map(()=>1/sec.columns.length);let total=widths.reduce((a,b)=>a+b,0);if(!sec.hideHeader)rows.push({cols:sec.columns,widths:widths.map(x=>x/total),header:true});for(let values of sec.rows){let lines=values.map((v,i)=>wrap(v,usable*widths[i]/total-24));rows.push({cols:values,widths:widths.map(x=>x/total),lines,height:Math.max(rowH,...lines.map(x=>x.length*29+18))})}}let H=195+rows.reduce((a,r)=>a+(r.gap?34:r.head?42:r.header?46:r.height),0)+100;let c=document.createElement('canvas');c.width=W;c.height=H;let ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.fillStyle='#143955';ctx.font='bold 35px sans-serif';ctx.fillText(title,margin,70);ctx.textAlign='right';ctx.font='bold 30px sans-serif';ctx.fillText(number,W-margin,70);ctx.textAlign='left';ctx.fillStyle='#64748b';ctx.font='18px sans-serif';ctx.fillText('滙嘉健康生活科技股份有限公司',margin,105);ctx.strokeStyle='#173f62';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(margin,123);ctx.lineTo(W-margin,123);ctx.stroke();let y=155;for(let r of rows){if(r.gap){y+=34;continue}if(r.head){ctx.fillStyle='#e9f1f8';ctx.fillRect(margin,y,usable,42);ctx.fillStyle='#173f62';ctx.font='bold 22px sans-serif';ctx.fillText(r.head,margin+13,y+29);ctx.strokeStyle='#b6c7d5';ctx.lineWidth=1;ctx.strokeRect(margin,y,usable,42);y+=42;continue}let h=r.header?46:r.height;ctx.fillStyle=r.header?'#edf3f8':'#fff';ctx.fillRect(margin,y,usable,h);ctx.strokeStyle='#aabaca';ctx.lineWidth=1;ctx.strokeRect(margin,y,usable,h);let x=margin;for(let i=0;i<r.cols.length;i++){let w=usable*r.widths[i];if(i){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+h);ctx.stroke()}ctx.fillStyle='#20384c';ctx.font=r.header?'bold 20px sans-serif':'20px sans-serif';let lines=r.header?[String(r.cols[i])]:r.lines[i];lines.forEach((line,j)=>ctx.fillText(line,x+12,y+29+j*29));x+=w}y+=h}ctx.fillStyle='#7a8795';ctx.font='16px sans-serif';ctx.fillText(foot,margin,H-35);c.toBlob(blob=>{if(blob)showJpgPreview(blob,filename.replace(/\.png$/i,'.jpg'))},'image/jpeg',.93)}
function downloadPng(id,mode='full'){let t=get(id);let sections=[{title:'基本資料',columns:['申請日期','申請人','機構名稱'],widths:[1,1,2],rows:[[t.date,t.applicant,t.institution]]},{title:'維修申請',columns:['序號','維修申請品項','數量','維修原因'],widths:[.4,2.1,.55,2],rows:t.items.map((x,i)=>[i+1,x.name,x.qty,x.reason||''])},{title:'申請備註',columns:['備註'],rows:[[t.note||'無']]}];if(mode==='full'){sections.push({title:'各品項回收與出貨統計',columns:['品項','申請','已回收','已出貨'],widths:[2,1,1,1],rows:t.items.map((x,i)=>[x.name,x.qty,recovered(t,i),shipped(t,i)])});for(let [key,title] of [['recoveries','回收紀錄'],['shipments','出貨紀錄']])sections.push({title,columns:['日期','品項及數量','備註'],widths:[1,2,2],rows:t[key].length?t[key].map(h=>[h.date,h.lines.map(l=>`${t.items[l.index]?.name||'品項'} × ${l.qty}`).join('、'),h.note||'']):[['—','尚無紀錄','']]})}canvasTable(mode==='full'?'完整維修紀錄':'維修申請單',t.number,sections,`${t.number}-${mode==='full'?'完整維修紀錄':'維修申請單'}.jpg`)}
let receiptRows=[];function receiptEditor(id){let t=get(id);receiptRows=t.items.map(x=>({name:x.name,qty:x.qty,note:''}));receiptForm(id,{staff:t.applicant,unit:t.institution,phone:'',address:'',quote:'',sales:'',date:today(),note:''})}
function receiptForm(id,v){modal(`<h2>產品送貨／簽收單</h2><p class="muted">依附件「產品送貨簽收單」設計，生成公司聯與客戶聯。內容可先修改再匯出。</p><div class="cols"><label class="field"><span>服務人員</span><input id="r-staff" value="${esc(v.staff)}"></label><label class="field"><span>日期</span><input id="r-date" type="date" value="${esc(v.date)}"></label></div><label class="field"><span>收貨單位</span><input id="r-unit" value="${esc(v.unit)}"></label><div class="cols"><label class="field"><span>聯絡電話</span><input id="r-phone" value="${esc(v.phone)}"></label><label class="field"><span>報價單號</span><input id="r-quote" value="${esc(v.quote)}"></label></div><label class="field"><span>收貨地址</span><input id="r-address" value="${esc(v.address)}"></label><label class="field"><span>銷貨單號</span><input id="r-sales" value="${esc(v.sales)}"></label><h3>品號／品名・數量・備註</h3><div id="receiptRows"></div><button class="btn secondary" onclick="receiptAdd()">＋ 新增品項</button><label class="field"><span>其他備註</span><textarea id="r-note">${esc(v.note)}</textarea></label><button class="btn" style="width:100%" onclick="receiptExport('${id}')">生成雙聯簽收單 JPG</button>`);receiptRender()}
function receiptRender(){document.getElementById('receiptRows').innerHTML=receiptRows.map((x,i)=>`<div class="item-row"><b>${i+1}.</b><label class="field"><span>品號／品名</span><input value="${esc(x.name)}" oninput="receiptRows[${i}].name=this.value"></label><div class="cols"><label class="field"><span>數量</span><input type="number" min="1" value="${esc(x.qty)}" oninput="receiptRows[${i}].qty=this.value"></label><label class="field"><span>備註</span><input value="${esc(x.note)}" oninput="receiptRows[${i}].note=this.value"></label></div><button class="btn secondary small" onclick="receiptRows.splice(${i},1);receiptRender()">移除此列</button></div>`).join('')}
function receiptAdd(){receiptRows.push({name:'',qty:1,note:''});receiptRender()}

function renderProjects(){const labels={project:'專案申請單',sample:'樣品申請單',ship:'待出貨',recover:'待回收',settings:'設定'};document.getElementById('pageTitle').textContent=labels[projectTab];document.querySelector('header .muted').textContent='滙嘉健康生活科技｜專案與樣品管理';document.getElementById('fab').classList.toggle('hidden',!['project','sample'].includes(projectTab));document.getElementById('fab').onclick=()=>projectEdit();document.getElementById('nav').style.gridTemplateColumns='repeat(5,1fr)';let recoveryUnits=new Set(state.projects.filter(t=>!t.deleted&&pendingRecovery(t)).map(t=>t.institution.trim()).filter(Boolean)).size;let shipCount=state.projects.filter(t=>!t.deleted&&t.items.some((x,i)=>shipped(t,i)<Number(x.qty))).length;document.getElementById('nav').innerHTML=[['project','▤','專案'],['sample','▤','樣品'],['ship','📦','待出貨'],['recover','↩','待回收'],['settings','⚙','設定']].map(([id,ico,label])=>`<button class="${projectTab===id?'active':''}" onclick="go('${id}')"><span class="ico">${navIcon(id)}${id==='ship'&&shipCount?`<span class="nav-count">${shipCount>99?'99+':shipCount}</span>`:''}${id==='recover'&&recoveryUnits?`<span class="nav-count">${recoveryUnits>99?'99+':recoveryUnits}</span>`:''}</span>${label}</button>`).join('');let arr=state.projects.filter(t=>!t.deleted&&matchesQuick(t)),m=document.getElementById('main');if(projectTab==='settings'){m.innerHTML=`<div class="panel"><div class="setting" onclick="combinedNumberSettings()"><div><b>🔢 單號格式</b><p>統一入口，分別編輯專案與樣品單號</p></div>›</div><div class="setting" onclick="reminderSettings()"><div><b>🔔 預計回收提醒</b><p>目前提前 ${state.reminderDays} 天提醒</p></div>›</div><div class="setting" onclick="projectProductsSettings()"><div><b>📋 專案／樣品品項</b><p>維護可選品項</p></div>›</div><div class="setting" onclick="settingsSync()"><div><b>🔑 專屬同步碼</b><p>雲端功能尚未啟用</p></div>›</div><div class="setting" onclick="projectArchive()"><div><b>🗂️ 指定單號封存／查詢</b></div>›</div><div class="setting" onclick="exportBackup()"><div><b>💾 匯出備份</b></div>›</div></div><div class="notice" // 正式啟用前資料清理：僅在使用者明確確認後刪除本機測試單據與草稿。
function clearAllTestData(){
  const count=(state.tickets||[]).length+(state.projects||[]).length;
  if(!confirm('將永久刪除此裝置上全部 '+count+' 筆維修／專案／樣品單據（含出貨、回收及封存紀錄），無法復原。產品清單及單號格式會保留。確定繼續？'))return;
  const phrase=prompt('為避免誤刪，請輸入「確認清空」：');
  if(phrase!=='確認清空'){alert('未清空任何資料');return;}
  state.tickets=[];state.projects=[];state.counter={};
  ['huijia-repair-unsaved-v2','hj-proj-draft-project','hj-proj-draft-sample'].forEach(k=>localStorage.removeItem(k));
  // 舊版本的回退資料亦一併清除，避免重新載入時重新匯入。
  localStorage.removeItem('huijia-repair-preview-v1');
  save();closeModal();render();alert('此裝置的測試單據與草稿已全部清空，可以開始正式建立新單據。');
}

const HJ_THEME_KEY='huijia-app-theme-v2';
const HJ_THEMES={warm:{name:'暖米杏（預設）',bg:'#e8dfd4',card:'#f2ebe2',ink:'#493f35',accent:'#9e8872',strong:'#78614d'},mint:{name:'薄荷綠',bg:'#e8f3ee',card:'#f1f8f4',ink:'#2f5050',accent:'#5ab9a4',strong:'#318d7b'},blue:{name:'霧淺藍',bg:'#e8f0f5',card:'#f2f7fa',ink:'#344d61',accent:'#80acc5',strong:'#487c9b'}};
let hjTheme;try{hjTheme=JSON.parse(localStorage.getItem(HJ_THEME_KEY))}catch(e){}if(!hjTheme||typeof hjTheme!=='object')hjTheme={...HJ_THEMES.warm};
function hjHex(v,def){return /^#[0-9a-fA-F]{6}$/.test(v)?v:def}
function hjRgb(hex){let x=hjHex(hex,'#e8dfd4').slice(1);return [0,2,4].map(i=>parseInt(x.slice(i,i+2),16))}
function hjMix(a,b,w){let x=hjRgb(a),y=hjRgb(b);return '#'+x.map((v,i)=>Math.round(v*(1-w)+y[i]*w).toString(16).padStart(2,'0')).join('')}
function applyHjTheme(t){const root=document.documentElement;const d=HJ_THEMES.warm;let v={};for(const k of ['bg','card','ink','accent','strong'])v[k]=hjHex(t[k],d[k]);root.style.setProperty('--hj-bg',v.bg);root.style.setProperty('--hj-card',v.card);root.style.setProperty('--hj-ink',v.ink);root.style.setProperty('--hj-accent',v.accent);root.style.setProperty('--hj-strong',v.strong);root.style.setProperty('--hj-soft',hjMix(v.bg,v.accent,.17));root.style.setProperty('--hj-border',hjMix(v.bg,v.ink,.18));root.style.setProperty('--hj-shadow',hjMix(v.bg,'#51473d',.17));root.style.setProperty('--hj-highlight',hjMix(v.card,'#ffffff',.72));document.querySelector('meta[name="theme-color"]')?.setAttribute('content',v.bg)}
function setHjTheme(t){hjTheme={...t};localStorage.setItem(HJ_THEME_KEY,JSON.stringify(hjTheme));applyHjTheme(hjTheme);render()}

    state.productCatalog[kind]=state.productCatalog[kind].filter(x=>x&&x.name).map((x,i)=>({id:x.id||kind+'-item-'+i,code:String(x.code||''),name:String(x.name),note:String(x.note||''),enabled:x.enabled!==false}));

function catalogFor(kind){return state.productCatalog[kind==='repair'?'repair':'project']}

function catalogOptions(kind,current){let items=catalogFor(kind).filter(x=>x.enabled||x.name===current);let seen=new Set();let result='<option value="">請選擇品項</option>';for(const x of items){if(seen.has(x.name))continue;seen.add(x.name);result+=`<option value="${esc(x.name)}" ${current===x.name?'selected':''}>${esc(x.name)}${x.enabled?'':'（已停用）'}</option>`}if(current&&!seen.has(current))result+=`<option value="${esc(current)}" selected>${esc(current)}（歷史品項）</option>`;return result}
function productHelpButton(kind){return `<button type="button" class="hj-help" onclick="showProductHelp('${kind}')" title="查看品號、品名及備註" aria-label="查看品項參考資料">參考</button>`}
function showProductHelp(kind){document.getElementById('hj-product-help')?.remove();let items=catalogFor(kind);let pane=document.createElement('div');pane.id='hj-product-help';pane.className='hj-help-backdrop';pane.innerHTML=`<div class="hj-help-sheet" role="dialog" aria-modal="true" aria-label="品項參考"><div class="row between"><h3>品項參考資料</h3><button type="button" class="btn secondary small" onclick="closeProductHelp()">關閉 ×</button></div><p class="muted">申請單僅顯示品名；此處可查詢品號、品名與備註。</p><input class="hj-help-search" placeholder="搜尋品號、品名或備註" oninput="filterProductHelp(this.value)"><div id="hj-help-items">${productHelpRows(items)}</div></div>`;pane.addEventListener('click',e=>{if(e.target===pane)closeProductHelp()});document.body.appendChild(pane);pane.querySelector('input').focus()}

function catalogSettings(kind){

function catalogEdit(kind,id){const x=id?catalogFor(kind).find(x=>x.id===id):null;modal(`<h2>${x?'編輯':'新增'}${kind==='repair'?'維修':'專案／樣品'}品項</h2><label class="field"><span>品號</span><input id="cat-code" value="${esc(x?.code||'')}" placeholder="例如：HJ-001"></label><label class="field"><span>品名 *</span><input id="cat-name" value="${esc(x?.name||'')}" placeholder="例如：智慧光纖薄墊"></label><label class="field"><span>備註</span><textarea id="cat-note" placeholder="例如：規格、型號或填寫提示">${esc(x?.note||'')}</textarea></label><p class="notice">品名是申請單顯示與記錄的文字。已使用過的品名建議不要改成不同產品，以免與歷史單據混淆。</p><div class="row"><button class="btn" onclick="catalogSave('${kind}',${id?`'${id}'`:'null'})">儲存品項</button><button class="btn secondary" onclick="catalogSettings('${kind}')">返回品項管理</button></div>`)}
function catalogSave(kind,id){let code=document.getElementById('cat-code').value.trim(),name=document.getElementById('cat-name').value.trim(),note=document.getElementById('cat-note').value.trim(),items=catalogFor(kind);if(!name)return alert('請輸入品名');if(items.some(x=>x.name===name&&x.id!==id))return alert('品名已存在，請直接編輯或重新啟用原品項');if(code&&items.some(x=>x.code===code&&x.id!==id))return alert('品號已存在，請使用不同品號');if(id){let x=items.find(x=>x.id===id);if(!x)return alert('找不到品項');Object.assign(x,{code,name,note})}else items.push({id:'cat-'+uid(),code,name,note,enabled:true});syncLegacyProducts();catalogSettings(kind)}

</style><script id="hj-v17-settings-script">

  ['theme','🎨 APP 色調設定','暖米杏預設色與自訂顏色','themeSettings()'],
  ['number','🔢 單號格式','維修單號編碼規則','numberSettings(\'repair\')'],
  ['products','📋 品項管理','新增、編輯、停用與重新啟用品項','settingsProducts()'],
  ['sync','🔑 專屬同步碼','雲端同步尚未啟用','settingsSync()'],
  ['archive','🗂️ 封存／已刪除單據','查看與管理封存單據','settingsDeleted()'],
  ['backup','💾 匯出資料備份','下載 JSON 備份','exportBackup()'],
  ['features','⚙️ 功能','簽收單功能、清除所有測試資料','hjFeatureSettings()']
 ]:[
  ['theme','🎨 APP 色調設定','暖米杏預設色與自訂顏色','themeSettings()'],
  ['number','🔢 單號格式','專案與樣品單號分別設定','combinedNumberSettings()'],
  ['products','📋 品項管理','專案／樣品品項','projectProductsSettings()'],
  ['reminder','🔔 預計回收提醒','調整回收提醒天數','reminderSettings()'],
  ['sync','🔑 專屬同步碼','雲端同步尚未啟用','settingsSync()'],
  ['archive','🗂️ 封存／已刪除單據','查看與管理封存單據','projectArchive()'],
  ['backup','💾 匯出資料備份','下載 JSON 備份','exportBackup()'],
  ['features','⚙️ 功能','簽收單功能、清除所有測試資料','hjFeatureSettings()']
 ];
 const order=hjReadSettingOrder(hjSettingsMode());
 definitions.sort((a,b)=>{const x=order.indexOf(a[0]),y=order.indexOf(b[0]);return (x<0?999:x)-(y<0?999:y)});
 window.hjCurrentSettingsOrder=definitions.map(x=>x[0]);
 main.innerHTML='<section class="panel" id="hj-sortable-settings"><p class="hj-settings-guide">長按項目前方的空心圓點，即可拖曳調整順序；放開後自動儲存。</p>'+definitions.map((item,i)=>`<div class="hj-setting-sort" data-setting-id="${item[0]}"><button type="button" class="hj-drag-handle" aria-label="長按拖曳排序：${item[1]}" title="長按拖曳排序" data-hj-handle="1"></button><div class="setting" onclick="${item[3]}"><div><b>${item[1]}</b><p>${item[2]}</p></div><span>›</span></div></div>`).join('')+'</section>';

/* Pointer long-press reorder: works with iPhone touch, mouse and stylus. */
function hjBindSettingsDrag(list){
 if(!list)return;

 const rows=()=>Array.from(list.querySelectorAll('.hj-setting-sort'));
 function clearHold(){if(hold){clearTimeout(hold.timer);hold=null}}
 function finish(commit){
  clearHold();
  if(!drag)return;
  const active=drag;drag=null;
  document.body.classList.remove('hj-sort-active');
  active.row.classList.remove('hj-dragging');
  active.handle.style.touchAction='pan-y';
  if(commit){const ids=rows().map(x=>x.dataset.settingId);hjSaveSettingOrder(hjSettingsMode(),ids);window.hjCurrentSettingsOrder=ids;}
  preventClick=true;
  setTimeout(()=>{preventClick=false},250);
 }
 list.addEventListener('click',e=>{if(preventClick){e.preventDefault();e.stopPropagation()}},true);
 list.addEventListener('pointerdown',e=>{
  const handle=e.target.closest('[data-hj-handle]');if(!handle||e.button!==0)return;
  clearHold();originY=e.clientY;lastY=e.clientY;
  const row=handle.closest('.hj-setting-sort');
  hold={id:e.pointerId,row,handle,timer:setTimeout(()=>{
    if(!hold||hold.id!==e.pointerId)return;
    drag={id:e.pointerId,row,handle};hold=null;
    row.classList.add('hj-dragging');document.body.classList.add('hj-sort-active');
    handle.style.touchAction='none';
    if(navigator.vibrate)navigator.vibrate(15);
  },350)};
 });
 document.addEventListener('pointermove',e=>{
  if(hold&&hold.id===e.pointerId&&Math.abs(e.clientY-originY)>9)clearHold();
  if(!drag||drag.id!==e.pointerId)return;
  e.preventDefault();lastY=e.clientY;
  const items=rows(),target=items.find(x=>x!==drag.row&&e.clientY>=x.getBoundingClientRect().top&&e.clientY<=x.getBoundingClientRect().bottom);
  if(target){const rect=target.getBoundingClientRect();list.insertBefore(drag.row,e.clientY<rect.top+rect.height/2?target:target.nextSibling)}
 },{passive:false});
 document.addEventListener('pointerup',e=>{if(hold&&hold.id===e.pointerId)clearHold();if(drag&&drag.id===e.pointerId)finish(true)});
 document.addEventListener('pointercancel',e=>{if(hold&&hold.id===e.pointerId)clearHold();if(drag&&drag.id===e.pointerId)finish(true)});
 list.addEventListener('keydown',e=>{
  const handle=e.target.closest('[data-hj-handle]');if(!handle||!e.altKey||!['ArrowUp','ArrowDown'].includes(e.key))return;
  e.preventDefault();const row=handle.closest('.hj-setting-sort');const items=rows(),i=items.indexOf(row),j=i+(e.key==='ArrowUp'?-1:1);
  if(j<0||j>=items.length)return;
  list.insertBefore(row,j<i?items[j]:items[j].nextSibling);
  const ids=rows().map(x=>x.dataset.settingId);hjSaveSettingOrder(hjSettingsMode(),ids);window.hjCurrentSettingsOrder=ids;handle.focus();
 });
}
function hjMoveSetting(i,d){let ids=[...(window.hjCurrentSettingsOrder||[])],j=i+d;if(j<0||j>=ids.length)return;[ids[i],ids[j]]=[ids[j],ids[i]];hjSaveSettingOrder(hjSettingsMode(),ids);render()}

/* V23 main dashboard + historical tickets; data is never archived or deleted automatically. */
let hjV23History=false,hjV23Expanded=false,hjV23Month='',hjV23Unit='';
function hjV23LocalMonth(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function hjV23Kind(){return mode==='repair'?'repair':projectTab}
function hjV23ListTab(){return mode==='repair'?tab==='tickets':['project','sample'].includes(projectTab)}
function hjV23Settings(){return mode==='repair'?tab==='settings':projectTab==='settings'}
function hjV23All(){return (mode==='repair'?state.tickets:state.projects).filter(t=>!t.deleted&&(mode==='repair'||t.kind===projectTab))}

function hjV38PendingCards(arr,showReminder=false){

     }

}
function hjV23Card(t){let kind=mode==='repair'?'repair':t.kind;let badges=statusBadges(t);let label=kind==='sample'?'使用單位':'機構';let click=mode==='repair'?`detail('${t.id}')`:`projectDetail('${t.id}')`;return `<article class="hj-v23-card ${hjV23Done(t)?'hj-v25-completed':''}" tabindex="0" role="button" onclick="${click}" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();${click}}"><span class="hj-v23-card-icon" aria-hidden="true">${kind==='repair'?'⚒':kind==='project'?'▤':'◇'}</span><div class="hj-v23-card-body"><strong>${hjV23Escape(t.number)}</strong><div class="hj-v23-meta">申請日期：${hjV23Escape(t.date)} &nbsp;|&nbsp; 申請人：${hjV23Escape(t.applicant)}</div><div class="hj-v23-meta">${label}：${hjV23Escape(t.institution)}</div></div><span class="status-pair">${!hjV23History&&hjV23Old(t)&&!hjV23Done(t)?'<span class="hj-cross-month">跨月未完成</span>':''}${badges}</span><span class="hj-v23-arrow">›</span></article>`}
function hjV23Units(){return [...new Set(hjV23All().map(t=>String(t.institution||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-Hant'))}
function hjV23Filter(t){let d=String(t.date||'');return (!hjV23Month||d.startsWith(hjV23Month))&&(!hjV23Unit||String(t.institution||'').trim()===hjV23Unit)&&matchesQuick(t)}
function hjV23FilterPanel(){let units=hjV23Units().map(x=>`<option value="${hjV23Escape(x)}" ${x===hjV23Unit?'selected':''}>${hjV23Escape(x)}</option>`).join('');return `<div class="hj-v23-filters" id="hjV23Panel" ${hjV23Expanded?'':'hidden'}><div class="hj-v23-filter-head"><b>進階篩選</b><span class="muted" style="font-size:11px">申請月份與機構可搭配關鍵字搜尋</span></div><div class="hj-v23-filter-grid"><label>申請月份<input type="month" id="hjV23Month" value="${hjV23Escape(hjV23Month)}" onchange="hjV23Change()"></label><label>機構／使用單位<select id="hjV23Unit" onchange="hjV23Change()"><option value="">全部機構／使用單位</option>${units}</select></label></div><div class="hj-v23-filter-actions"><button class="btn secondary small" onclick="hjV23Clear()">清除篩選</button><button class="btn secondary small" onclick="hjV23Toggle()">收起 ⌃</button></div></div>`}
function hjV23Refresh(){
 if(!hjV23ListTab())return;
 const m=document.getElementById('main');if(!m)return;
 let arr=hjV23All().filter(t=>hjV23History?true:(!hjV23Old(t)||!hjV23Done(t))).filter(hjV23Filter).sort((a,b)=>Number(hjV23Done(a))-Number(hjV23Done(b))||String(b.date).localeCompare(String(a.date))||String(b.number).localeCompare(String(a.number)));
 let filters=[hjV23Month&&('月份：'+hjV23Month),hjV23Unit&&('機構：'+hjV23Unit)].filter(Boolean);
 const toolbar=`<div class="hj-v23-toolbar"><small>${hjV23History?'依申請年月分類 · 全部單據':'本月全部＋跨月未完成'} · 共 ${arr.length} 筆</small><button class="btn secondary small" onclick="hjV23Toggle()">${hjV23Expanded?'收起篩選 ⌃':'篩選 ☷'}</button></div>`;
 let list='';
 if(hjV23History){

   for(const t of arr){let d=String(t.date||'');let ym=/^\d{4}-\d{2}/.test(d)?d.slice(0,7):'未設定日期';let y=ym==='未設定日期'?'未設定日期':ym.slice(0,4);if(!years.has(y))years.set(y,new Map());let months=years.get(y);if(!months.has(ym))months.set(ym,[]);months.get(ym).push(t)}
   list=[...years.entries()].sort((a,b)=>b[0].localeCompare(a[0])).map(([year,months])=>`<section class="hj-h-year"><h3>${hjV23Escape(year)}${year==='未設定日期'?'':' 年'}</h3>${[...months.entries()].sort((a,b)=>b[0].localeCompare(a[0])).map(([ym,ts])=>`<details class="hj-h-month" ${hjV23Month||years.size===1&&months.size===1?'open':''}><summary><span>${ym==='未設定日期'?'未設定日期':Number(ym.slice(5))+' 月'}</span><span class="hj-h-count">${ts.length} 筆 <span class="hj-h-chevron">⌄</span></span></summary><div class="hj-v23-list">${ts.map(hjV23Card).join('')}</div></details>`).join('')}</section>`).join('');

}
function hjV30HistoryTabs(){

/* V33 historical page: category/year/month/keyword, full statuses, pagination. */
let hjV33Year='',hjV33Month='',hjV33Search='',hjV33Unit='',hjV33Page=1;
const hjV33OriginalRefresh=hjV23Refresh;
function hjV33Icon(kind){const paths={repair:'<path d="M21 7a7 7 0 0 1-9 9L5 22a2 2 0 0 1-3-3l6-6a7 7 0 0 1 9-9l-4 4 3 3z"/>',project:'<rect x="4" y="5" width="16" height="17" rx="2"/><rect x="9" y="2" width="6" height="5" rx="1"/><path d="m8 14 3 3 5-6"/>',sample:'<path d="m3 7 9-4 9 4-9 4-9-4Zm0 0v11l9 5 9-5V7M12 11v12"/>'};return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[kind]}</svg>`}

function hjV33Change(field,value){if(field==='year'){hjV33Year=value;hjV33Month=''}if(field==='month')hjV33Month=value;if(field==='search')hjV33Search=value;if(field==='unit')hjV33Unit=value;hjV33Page=1;hjV23Refresh();if(field==='search'){const q=document.getElementById('hjV33Search');if(q){q.focus();q.setSelectionRange(value.length,value.length)}}}
function hjV33GoPage(n){hjV33Page=n;hjV23Refresh();document.getElementById('hjV33Results')?.scrollIntoView({block:'start',behavior:'smooth'})}
function hjV33Card(t){let kind=hjV23Kind(),done=hjV23Done(t),old=hjV23Old(t),st=done?'已完成':old?'跨月未完成':(kind==='repair'?status(t):projStatus(t));let cls=done?'done':old?'overdue':/出貨/.test(st)?'ship':'pending';let target=kind==='repair'?`detail('${t.id}')`:`projectDetail('${t.id}')`;return `<article class="hj-v33-record ${done?'is-done':''}" role="button" tabindex="0" onclick="${target}" onkeydown="if(event.key==='Enter'){${target}}"><span class="hj-v33-record-icon ${kind}">${hjV33Icon(kind)}</span><span class="hj-v33-record-info"><strong>${hjV23Escape(t.number||'未編號')}</strong><small>申請日期：${hjV23Escape(t.date||'—')}</small><small>申請人：${hjV23Escape(t.applicant||'—')} <i>|</i> ${kind==='sample'?'使用單位':'機構'}：${hjV23Escape(t.institution||'—')}</small></span><span class="hj-v33-status ${cls}">${hjV23Escape(st)}</span><span class="hj-v33-chevron">›</span></article>`}
function hjV33UnusedRefresh(){if(!hjV23History){hjV33OriginalRefresh();return}if(!hjV23ListTab())return;const main=document.getElementById('main');if(!main)return;
 const kind=hjV23Kind(),types=[['repair','維修申請單'],['project','專案申請單'],['sample','樣品申請單']];let all=hjV23All();let years=[...new Set(all.map(t=>String(t.date||'').slice(0,4)).filter(x=>/^\d{4}$/.test(x)))].sort().reverse();let months=[...new Set(all.filter(t=>!hjV33Year||String(t.date||'').startsWith(hjV33Year)).map(t=>String(t.date||'').slice(5,7)).filter(x=>/^\d{2}$/.test(x)))].sort().reverse();let units=[...new Set(all.map(t=>String(t.institution||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-Hant'));let key=hjV33Search.trim().toLowerCase();let arr=all.filter(t=>(!hjV33Year||String(t.date||'').startsWith(hjV33Year))&&(!hjV33Month||String(t.date||'').slice(5,7)===hjV33Month)&&(!hjV33Unit||String(t.institution||'').trim()===hjV33Unit)&&(!key||[t.number,t.date,t.applicant,t.institution,t.note,t.notes,...(t.items||[]).flatMap(i=>[i.name,i.product,i.reason,i.note,i.notes])].some(x=>String(x||'').toLowerCase().includes(key)))).sort((a,b)=>Number(hjV23Done(a))-Number(hjV23Done(b))||String(b.date||'').localeCompare(String(a.date||''))||String(b.number||'').localeCompare(String(a.number||'')));
 const per=8,pages=Math.max(1,Math.ceil(arr.length/per));hjV33Page=Math.min(hjV33Page,pages);let shown=arr.slice((hjV33Page-1)*per,hjV33Page*per);let label=types.find(x=>x[0]===kind)[1];
 main.innerHTML=`<div class="hj-v33-history hj-v34-history"><button type="button" class="hj-v34-home" onclick="hjV23OpenHistory(false)">‹ 返回主頁</button><div class="hj-v34-heading"><h2>歷史單據</h2><p>依申請年月、機構及關鍵字查詢全部單據</p></div><div class="hj-v33-types">${types.map(([id,name])=>`<button type="button" class="hj-v33-type ${id} ${id===kind?'active':''}" aria-pressed="${id===kind}" onclick="hjV33SelectType('${id}')"><span class="hj-v33-type-icon">${hjV33Icon(id)}</span><span>${name}</span></button>`).join('')}</div><div class="hj-v34-filter-grid"><label>申請年月<input type="month" value="${hjV33Year&&hjV33Month?hjV33Year+'-'+hjV33Month:''}" onchange="hjV34MonthChange(this.value)" aria-label="申請年月"></label><label>機構／使用單位<select onchange="hjV33Change('unit',this.value)"><option value="">全部機構／使用單位</option>${units.map(u=>`<option value="${hjV23Escape(u)}" ${u===hjV33Unit?'selected':''}>${hjV23Escape(u)}</option>`).join('')}</select></label><label class="hj-v34-keyword">關鍵字<input id="hjV33Search" aria-label="關鍵字搜尋" placeholder="單號、機構、申請人、品項…" value="${hjV23Escape(hjV33Search).replace(/"/g,'&quot;')}" oninput="hjV33Change('search',this.value)"></label></div><div class="hj-v34-filter-actions"><button type="button" onclick="hjV34Reset()">清除篩選</button></div><div id="hjV33Results" class="hj-v33-results"><div class="hj-v33-results-head"><h3>查詢結果－<em>${label}</em></h3><span>共 ${arr.length} 筆</span></div><div class="hj-v33-records">${shown.length?shown.map(hjV33Card).join(''):'<div class="hj-v33-empty">沒有符合條件的單據，請調整篩選條件。</div>'}</div>${arr.length?`<div class="hj-v33-pages"><button ${hjV33Page===1?'disabled':''} onclick="hjV33GoPage(${hjV33Page-1})">‹</button><span>第 ${hjV33Page} / ${pages} 頁</span><button ${hjV33Page===pages?'disabled':''} onclick="hjV33GoPage(${hjV33Page+1})">›</button></div>`:''}</div></div>`;
 document.getElementById('fab')?.classList.add('hidden');
};
function hjV34MonthChange(v){hjV33Year=v?v.slice(0,4):'';hjV33Month=v?v.slice(5,7):'';hjV33Page=1;hjV23Refresh()}
function hjV34Reset(){hjV33Year=hjV33Month=hjV33Unit=hjV33Search='';hjV33Page=1;hjV23Refresh()}
const hjV33OldOpen=hjV23OpenHistory;
hjV23OpenHistory=function(on){if(on){hjV33Year='';hjV33Month='';hjV33Search='';hjV33Unit='';hjV33Page=1}return hjV33OldOpen(on)};


/* V39: one history search across all three document types; main dashboards untouched. */
let hjV39Type='all',hjV39Month='',hjV39Unit='',hjV39Keyword='';
function hjV39All(){
 return [...(state.tickets||[]).filter(t=>!t.deleted).map(t=>({...t,_v39Kind:'repair'})),
 ...(state.projects||[]).filter(t=>!t.deleted).map(t=>({...t,_v39Kind:t.kind==='sample'?'sample':'project'}))];
}
function hjV39KindLabel(k){return k==='repair'?'維修單':k==='sample'?'樣品申請單':'專案申請單'}
function hjV39SearchText(t){
 const fields=[t.number,t.date,t.applicant,t.institution,t.department,t.order,t.erpOrder,t.note,t.expectedShip,t.expectedReturn,
 ...(t.items||[]).flatMap(x=>[x.name,x.reason,x.note,x.code]),
 ...(t.shipments||[]).flatMap(x=>[x.date,x.staff,x.note]),
 ...(t.recoveries||[]).flatMap(x=>[x.date,x.staff,x.note])];
 return fields.map(x=>String(x??'')).join(' ').toLocaleLowerCase();
}
function hjV39Done(t){return t._v39Kind==='repair'?status(t)==='已完成':projStatus(t)==='已完成'}
function hjV39Card(t){
 const kind=t._v39Kind,done=hjV39Done(t),label=kind==='sample'?'使用單位':'機構';
 const click=kind==='repair'?`detail('${t.id}')`:`projectDetail('${t.id}')`;
 const icon=kind==='repair'?'⚒':kind==='project'?'▤':'◇';
 return `<article class="hj-v23-card ${done?'hj-v25-completed':''}" role="button" tabindex="0" onclick="${click}" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();${click}}"><span class="hj-v23-card-icon">${icon}</span><div class="hj-v23-card-body"><strong>${hjV23Escape(t.number)}</strong><div class="hj-v23-meta">${hjV39KindLabel(kind)} · 申請日期：${hjV23Escape(t.date)} | 申請人：${hjV23Escape(t.applicant)}</div><div class="hj-v23-meta">${label}：${hjV23Escape(t.institution)}</div></div><span class="status-pair">${statusBadges(t)}</span><span class="hj-v23-arrow">›</span></article>`;
}
function hjV39Refresh(){
 const main=document.getElementById('main');if(!main)return;
 const all=hjV39All();const units=[...new Set(all.filter(t=>hjV39Type==='all'||t._v39Kind===hjV39Type).map(t=>String(t.institution||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-Hant'));
 let records=all.filter(t=>(hjV39Type==='all'||t._v39Kind===hjV39Type)&&(!hjV39Month||String(t.date||'').startsWith(hjV39Month))&&(!hjV39Unit||String(t.institution||'').trim()===hjV39Unit)&&(!hjV39Keyword||hjV39SearchText(t).includes(hjV39Keyword.trim().toLocaleLowerCase())));
 records.sort((a,b)=>Number(hjV39Done(a))-Number(hjV39Done(b))||String(b.date||'').localeCompare(String(a.date||''))||String(b.number||'').localeCompare(String(a.number||'')));
 const years=new Map();for(const t of records){const d=String(t.date||'');const ym=/^\d{4}-\d{2}/.test(d)?d.slice(0,7):'未設定日期';const year=ym==='未設定日期'?'未設定日期':ym.slice(0,4);if(!years.has(year))years.set(year,new Map());const months=years.get(year);if(!months.has(ym))months.set(ym,[]);months.get(ym).push(t)}
 const groups=[...years.entries()].sort((a,b)=>b[0].localeCompare(a[0])).map(([year,months])=>`<section class="hj-h-year"><h3>${hjV23Escape(year)}${year==='未設定日期'?'':' 年'}</h3>${[...months.entries()].sort((a,b)=>b[0].localeCompare(a[0])).map(([ym,ts])=>`<details class="hj-h-month" ${hjV39Month?'open':''}><summary><span>${ym==='未設定日期'?'未設定日期':Number(ym.slice(5))+' 月'}</span><span class="hj-h-count">${ts.length} 筆 <span class="hj-h-chevron">⌄</span></span></summary><div class="hj-v23-list">${ts.map(hjV39Card).join('')}</div></details>`).join('')}</section>`).join('');
 const typeOpts=[['all','全部單據'],['repair','維修單'],['project','專案申請單'],['sample','樣品申請單']].map(([v,n])=>`<option value="${v}" ${v===hjV39Type?'selected':''}>${n}</option>`).join('');
 const unitOpts=units.map(u=>`<option value="${hjV23Escape(u)}" ${u===hjV39Unit?'selected':''}>${hjV23Escape(u)}</option>`).join('');
 main.innerHTML=`<div class="hj-v39-history"><div class="hj-v39-header"><button class="hj-v39-back" onclick="hjV23OpenHistory(false)">‹ 返回主頁</button><h2>歷史表單</h2></div><div class="hj-v39-filters"><div class="hj-v39-filter-head"><b>進階篩選</b><span>可輸入單一中文字查詢</span></div><div class="hj-v39-grid"><label>表單選擇<select id="hjV39Type" onchange="hjV39Set('type',this.value)">${typeOpts}</select></label><label>申請月份<input type="month" id="hjV39Month" value="${hjV23Escape(hjV39Month)}" onchange="hjV39Set('month',this.value)"></label><label>機構／使用單位<select id="hjV39Unit" onchange="hjV39Set('unit',this.value)"><option value="">全部機構／使用單位</option>${unitOpts}</select></label><label>關鍵字<input id="hjV39Keyword" type="search" placeholder="機構、申請人、品項、單號…" value="${hjV23Escape(hjV39Keyword)}" oninput="hjV39SearchInput(this.value,event)" oncompositionstart="hjV39Composing=true;clearTimeout(hjV39Timer)" oncompositionend="hjV39Composing=false;hjV39SearchInput(this.value,event)"></label></div><div class="hj-v39-actions"><button class="btn secondary small" onclick="hjV39Reset()">清除篩選</button><button class="btn secondary small" onclick="hjV39Toggle(this)">收起 ⌃</button></div></div><div class="hj-v39-summary"><span>依申請年月分類 · 包含已完成及未完成</span><strong>共 ${records.length} 筆</strong></div>${records.length?groups:'<div class="hj-v23-empty">沒有符合條件的單據</div>'}</div>`;
 document.getElementById('fab')?.classList.add('hidden');
}
function hjV39Set(field,value){if(field==='type'){hjV39Type=value;hjV39Unit=''}if(field==='month')hjV39Month=value;if(field==='unit')hjV39Unit=value;hjV39Refresh()}
let hjV39Timer, hjV39Composing=false;
function hjV39SearchInput(value,event){
 hjV39Keyword=value;
 clearTimeout(hjV39Timer);
 // Wait until Chinese IME composition has finished before changing the DOM.
 if(hjV39Composing || event?.isComposing || event?.inputType==='insertCompositionText')return;
 hjV39Timer=setTimeout(()=>{
  if(hjV39Composing)return;
  const input=document.getElementById('hjV39Keyword');
  if(!input)return;
  const wasFocused=document.activeElement===input;
  const cursor=wasFocused?input.selectionStart:null;
  // Refresh only after the IME confirms a character, then restore focus/caret.
  hjV39Refresh();
  const next=document.getElementById('hjV39Keyword');
  if(next&&wasFocused){next.focus({preventScroll:true});if(cursor!==null)try{next.setSelectionRange(cursor,cursor)}catch(e){}}
 },320);
}
function hjV39Reset(){hjV39Type='all';hjV39Month=hjV39Unit=hjV39Keyword='';hjV39Refresh()}
function hjV39Toggle(btn){const panel=btn.closest('.hj-v39-filters');const grid=panel.querySelector('.hj-v39-grid');const hidden=grid.hidden;grid.hidden=!hidden;btn.textContent=hidden?'收起 ⌃':'展開 ⌄'}
const hjV39OldRefresh=hjV23Refresh;
hjV23Refresh=function(){if(hjV23History){hjV39Refresh();return}return hjV39OldRefresh()};
const hjV39OldOpen=hjV23OpenHistory;
hjV23OpenHistory=function(on){if(on){hjV39Type='all';hjV39Month=hjV39Unit=hjV39Keyword=''}return hjV39OldOpen(on)};

render();
</script></body></html>
