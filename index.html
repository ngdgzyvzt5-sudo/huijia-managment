let state;try{state=JSON.parse(localStorage.getItem(K))}catch{}if(!state){try{state=JSON.parse(localStorage.getItem('huijia-repair-preview-v1'))}catch{}}if(!state)state={tickets:demo,products:['智慧光纖薄墊','智慧光纖監視器','智慧光纖坐墊','智慧復健走道','藍牙血壓計','藍牙血氧機','紅外線額溫槍'],title:'維修申請單',syncCode:'',counter:{}};state.counter??={};state.products??=[];state.tickets??=[];let tab='tickets',search={month:'',person:'',institution:'',keyword:''};function save(){localStorage.setItem(K,JSON.stringify(state))}function shipped(t,i){return t.shipments.reduce((s,h)=>s+h.lines.filter(l=>l.index===i).reduce((a,l)=>a+Number(l.qty),0),0)}function recovered(t,i){return t.recoveries.reduce((s,h)=>s+h.lines.filter(l=>l.index===i).reduce((a,l)=>a+Number(l.qty),0),0)}function status(t){let total=t.items.reduce((a,x)=>a+Number(x.qty),0),sent=t.items.reduce((a,x,i)=>a+shipped(t,i),0),rec=t.items.reduce((a,x,i)=>a+recovered(t,i),0);if(sent>=total&&rec>=total)return '已完成';if(sent>=total)return '待回收';if(rec>=total)return '待出貨';return sent>0||rec>0?'處理中':'待回收・待出貨'}function pill(t){let s=status(t);return `<span class="pill ${s==='已完成'?'done':s==='處理中'?'partial':''}">${s}</span>`}function active(){return state.tickets.filter(t=>!t.deleted)}function repairBadgeCount(kind){return active().filter(t=>t.items.some((x,i)=>(kind==='pending'?shipped(t,i):recovered(t,i))<Number(x.qty))).length}function render(){document.getElementById('pageTitle').textContent=({tickets:'維修單',pending:'待出貨',recover:'待回收',settings:'設定'})[tab];document.getElementById('fab').classList.toggle('hidden',tab!=='tickets');document.getElementById('nav').innerHTML=[['tickets','▤','維修單'],['pending','📦','待出貨'],['recover','↩','待回收'],['settings','⚙','設定']].map(([id,ico,name])=>`<button class="${tab===id?'active':''}" onclick="go('${id}')"><span class="ico">${ico}${(id==='pending'||id==='recover')&&repairBadgeCount(id)?`<span class="nav-count">${repairBadgeCount(id)>99?'99+':repairBadgeCount(id)}</span>`:''}</span>${name}</button>`).join('');let m=document }function go(t){tab=t;render()}function cards(arr){return arr.length?arr.map(t=>`<article tabindex="0" role="button" aria-label="查看維修單 ${esc(t.number)}" onclick="detail('${t.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();detail('${t.id}')}" class="ticket compact ${status(t)==='已完成'?'done':''}"><div class="ticket-top"><strong>${esc(t.number)}</strong>${statusBadges(t)}</div><div class="compact-info"><span>申請日期　${esc(t.date)}</span><span>申請人　${esc(t.applicant)}</span></div><div class="compact-inst">${t.kind==='sample'?'使用單位':'機構'}　${esc(t.institution)}</div></article>`).join(''):'<div class="empty">目前沒有符合條件的維修單</div>'}function updateSearch(){search={month:document.getElementById('s-month').value,person:document.getElementById('s-person').value,institution:document.getElementById('s-institution').value,keyword:document.getElementById('s-keyword').value};showSearch()}function showSearch(){let a=active().filter(t=>(!search.month||t.date.startsWith(search.month))&&t.applicant.includes(search.person)&&t.institution.includes(search.institution)&&[t.number,t.note,...t.items.flatMap(i=>[i.name,i.reason]),...t.shipments.map(x=>x.note),...t.recoveries.map(x=>x.note)].join(' ').toLowerCase().includes(search.keyword.toLowerCase()));document.getElementById('searchResults').innerHTML=cards(a.sort((a,b)=>b.number.localeCompare(a.number)))}function modal(html){document.getElementById('overlay').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><section class="sheet"><div class="sheet-head"><b>滙嘉維修管理</b><button class="close" onclick="closeModal()">×</button></div>${html}</section></div>`}function closeModal(){document.getElementById('overlay').innerHTML=''}function get(id){return state.tickets.find(t=>t.id===id)}function nextNumber(date){return allocateNumber('repair',date)}const DRAFT_KEY='huijia-repair-unsaved-v2',DRAFT_TTL=30*60*1000;let editingId=null,reservedNumber='';function readDraft(){try{let d=JSON.parse(localStora function optionList(value){return `<option value="">請選擇品項</option>${state.products.map(x=>`<option value="${esc(x)}" ${value===x?'selected':''}>${esc(x)}</option>`).join('')}`}
let draft=[];function editTicket(id){let t=id?get(id):null;if(t&&(t.shipments.length||t.recoveries.length))return alert('已有出貨或回收紀錄，申請內容已鎖定。');editingId=id||null;let old=!t?readDraft():null;draft=t?t.items.map(x=>({...x})):old?.items?.length?old.items:[{name:'',qty:'',reason:''}];reservedNumber=t?.number||old?.number||nextNumber(today());if(!t&&old?.date&&!reservedNumber.startsWith(numberBase('repair',old.date)))reservedNumber=nextNumber(old.date);modal(`<div class="row between"><h2>${t?'編輯維修單':'新增維修單'}</h2><div class="detail-number" id="reservedNumber">${esc(reservedNumber)}</div></div>${old?'<div class="notice">已恢復 30 分鐘內尚未儲存的內容。</div>':''}<div class="cols"><label class="field"><span>申請日期 *</span><input id="f-date" type="date" value="${esc(t?.date||old?.date||today())}" onchange="refreshReserved()"></label><label class="field"><span>申請人 *</span><input id="f-person" value="${esc(t?.applicant||old?.applicant||'')}"></label></div><label class="field"><span>機構名稱 *</span><input id="f-inst" value="${esc(t?.institution||old?.institution||'')}"></label><div class="line"></div><h3>維修申請</h3><div id="draftRows"></div><button class="btn secondary" onclick="addRow()">＋ 增加申請格</button><label class="field"><span>備註（自由輸入）</span><textarea id="f-note">${esc(t?.note||old?.note||'')}</textarea></label><button class="btn" style="width:100%" onclick="saveTicket('${id||''}')">儲存維修單</button>`);renderRows();if(!t){document.querySelector('.sheet').addEventListener('input',persistDraft);document.querySelector('.sheet').addEventListener('change',persistDraft);persistDraft()}}
function renderRows(){document.getElementById('draftRows').innerHTML=draft.map((x,i)=>`<div class="item-row"><div class="row between"><span class="item-title">${i+1}.</span>${draft.length>1?`<button class="btn secondary small" onclick="removeRow(${i})">移除</button>`:''}</div><label class="field"><span>維修品項</span><select onchange="draft[${i}].name=this.value;persistDraft()">${optionList(x.name)}</select></label><div class="cols"><label class="field"><span>數量（選品項後必填）</span><input type="number" min="1" step="1" value="${esc(x.qty)}" oninput="draft[${i}].qty=this.value;persistDraft()"></label><label class="field"><span>維修原因（選填）</span><input value="${esc(x.reason)}" oninput="draft[${i}].reason=this.value;persistDraft()" placeholder="故障原因"></label></div></div>`).join('')}function addRow(){draft.push({name:'',qty:'',reason:''});renderRows();persistDraft()}function removeRow(i){draft.splice(i,1);renderRows();persistDraft()}function saveTicket(id){let date=document.getElementById('f-date').value,applicant=document.getElementById('f-person').value.trim(),institution=document.getElementById('f-inst').value.trim(),note=document.getElementById('f-note').value.trim();let items=draft.filter(x=>x.name);if(!date||!applicant||!institution||!items.length)return alert('請填寫申請日期、申請人、機構及至少一項維修品項。');if(items.some(x=>!Number.isInteger(Number(x.qty))||Number(x.qty)<=0))return alert('每個已選維修品項都必須填寫大於 0 的整數數量。');items=items.map(x=>({name:x.name,qty:Number(x.qty),reason:x.reason||''}));if(id){let t=get(id);if(t.shipments.length||t.recoveries.length)return alert('已有出貨或回收紀錄，不可修改');Object.assign(t,{date,applicant,institution,note,items})}else{if(state.tickets.some(x=>x.number===reservedNumber&&(!x.deleted||x.shipments?.length||x.recoveries?.length)))reservedNumber=nextNumber(date);state.tickets.push({id:uid(),number:reservedNumber,date,applicant,institution,note,items,shipments:[],recoveries:[],deleted:false})}save();if(!id)clearDraft();closeModal();tab='tickets';render()}
function detail(id){let t=get(id),locked=t.shipments.length>0||t.recoveries.length>0;modal(`<div class="row between"><h2>${esc(state.title)}</h2>${statusBadges(t)}</div><div class="detail-number">${esc(t.number)}</div><p class="muted">申請日期：${esc(t.date)}｜申請人：${esc(t.applicant)}</p><p><b>機構：</b>${esc(t.institution)}</p><div class="line"></div><h3>維修申請</h3>${t.items.map((x,i)=>`<div class="item-row"><b>${esc(x.name)}</b>　× ${x.qty}<p class="muted">維修原因：${esc(x.reason||'—')}</p><p class="muted">已回收 ${recovered(t,i)}／已出貨 ${shipped(t,i)}</p></div>`).join('')}<p><b>備註：</b>${esc(t.note||'—')}</p><div class="notice">${locked?'此單已有出貨或回收紀錄，申請內容已鎖定。':'尚未出貨／回收，申請內容可修改。'} 回收與出貨歷史獨立保存。</div><div class="row"><button class="btn secondary action-large" onclick="actionForm('${id}','recover')" ${t.items.every((x,i)=>recovered(t,i)>=x.qty)?'disabled':''}>記錄回收</button>${t.items.some((x,i)=>shipped(t,i)<x.qty)?`<button class="btn action-large" onclick="actionForm('${id}','ship')">${locked?'繼續出貨':'出貨'}</button>`:''}${!locked?`<button class="btn outline" onclick="editTicket('${id}')">編輯申請</button>`:''}<button class="btn outline" onclick="exportMenu('${id}')">匯出圖檔</button><button class="btn outline" onclick="receiptEditor('${id}')">簽收單</button>${!locked&&!t.deleted?`<button class="btn danger" onclick="repairDeleteUnprocessed('${id}')">刪除單據</button>`:''}</div><div class="line"></div><h3>回收紀錄</h3>${history(t.recoveries,t,'回收')}<div class="line"></div><h3>出貨紀錄</h3>${history(t.shipments,t,'出貨')}`)}function history(arr,t,word){return arr.length?arr.map((h,i)=>`<div class="history"><b>第 ${i+1} 次${word}｜${esc(h.date)}</b><p style="font-size:13px">${h.lines.map(l=>`${esc(t.items[l.index]?.name||'品項')} × ${l.qty}`).join('、')}</p><p class="muted">${esc(h.note||'無備註')}</p></div>`).join(''):`<p class="muted">尚無${word}紀錄</p>`}
function actionForm(id,type){let t=get(id),isShip=type==='ship',word=isShip?'出貨':'回收';if(isShip&&t.items.every((x,i)=>shipped(t,i)>=x.qty))return alert('此單已全部出貨');if(!isShip&&t.items.every((x,i)=>recovered(t,i)>=x.qty))return alert('此單已全部回收');let available=t.items.map((x,i)=>x.qty-(isShip?shipped(t,i):recovered(t,i)));modal(`<h2>新增${word}紀錄</h2><p class="muted">維修單號：${esc(t.number)}</p><div class="notice">${isShip?'可一次出貨全部剩餘品項，也可只出貨部分數量。第一次出貨後，原始維修申請將鎖定。':'可在申請當天或日後回收；回收日期與申請日期可不同。'}</div><div class="panel"><h3>選擇${word}品項與數量</h3>${t.items.map((x,i)=>`<div class="checkrow"><div><b style="font-size:13px">${esc(x.name)}</b><p class="muted">申請 ${x.qty}｜${isShip?'尚待出貨':'尚待回收'} ${available[i]}</p></div><input id="a-${i}" type="number" min="0" max="${available[i]}" step="1" value="0" ${available[i]<=0?'disabled':''}></div>`).join('')}${isShip?'<button class="btn secondary small" onclick="fillAll()">整批出貨（填入全部剩餘數量）</button>':''}</div><label class="field"><span>${word}日期 *</span><input type="date" id="a-date" value="${today()}"></label><label class="field"><span>${word}備註（選填）</span><textarea id="a-note" placeholder="例如：宅配寄出／交由某位客服／現場收回"></textarea></label><button class="btn" style="width:100%" onclick="saveAction('${id}','${type}')">確認${word}</button>`)}function fillAll(){document.querySelectorAll('[id^="a-"]').forEach(x=>{if(x.type==='number'&&!x.disabled)x.value=x.max})}function saveAction(id,type){let t=get(id),isShip=type==='ship',arr=isShip?t.shipments:t.recoveries,date=document.getElementById('a-date').value,note=document.getElementById('a-note').value.trim(),lines=[];for(let i=0;i<t.items.length;i++){let el=document.getElementById('a-'+i),qty=Number(el.value),available=t.items[i].qty-(isShip?shipped(t,i):recovered(t,i));if(!Number.isInteger(qty)||qty<0||qty>available)return alert('數量必須為 0 到剩餘數量之間的整數');if(qty>0)lines.push({index:i,qty})}if(!date||!lines.length)return alert('請填寫日期，並至少選擇一個數量大於 0 的品項');arr.push({date,note,lines});save();closeModal();render();detail(id)}
function settingsProducts(){modal(`<h2>維修申請項目管理</h2><div id="productList">${state.products.map((x,i)=>`<div class="row between item-row"><span>${esc(x)}</span><button class="btn secondary small" onclick="removeProduct(${i})">停用</button></div>`).join('')}</div><label class="field"><span>新增維修品項</span><input id="newProduct" placeholder="例如：智慧光纖薄墊感測線"></label><button class="btn" onclick="addProduct()">新增品項</button><div class="notice">停用只會從未來新增維修單的下拉選單移除，不影響既有紀錄。</div>`)}function addProduct(){let v=document.getElementById('newProduct').value.trim();if(!v)return;if(state.products.includes(v))return alert('此品項已存在');state.products.push(v);save();settingsProducts()}function removeProduct(i){if(!confirm('停用此品項？舊維修單不受影響。'))return;state.products.splice(i,1);save();settingsProducts()}function settingsFormat(){modal(`<h2>維修單格式設定</h2><label class="field"><span>單據標題</span><input id="formatTitle" value="${esc(state.title)}"></label><div class="notice">單號固定顯示在右上角；每列申請格含維修品項、數量與維修原因。未出貨可編輯，出貨後鎖定。</div><button class="btn" onclick="state.title=document.getElementById('formatTitle').value.trim()||'維修申請單';save();closeModal()">儲存格式</button>`)}function settingsSync(){modal(`<h2>專屬同步碼</h2><div class="notice"><b>雲端同步尚未啟用。</b> 此畫面是正式版配對流程預覽，下面的代碼不會同步資料，請勿當作真實同步憑證。</div><p>正式版預計：第一台裝置產生高強度配對密鑰，其他手機或電腦輸入密鑰後，連接同一份雲端資料。</p><div class="code">尚未連接雲端</div><p class="muted">正式版需部署雲端資料庫、安全權限與配對機制。</p>`)}function repairDeleteUnprocessed(id){let t=get(id);if(!t||t.deleted)return;if(t.shipments.length||t.recoveries.length)return alert('已有處理紀錄，請在設定封存');if(!confirm('確定刪除 '+t.number+'？此單號可再次使用。'))return;state.tickets=state.tickets.filter(x=>x.id!==id);save();closeModal();render()}function settingsDeleted(){modal(`<h2>已處理維修單封存／查詢</h2><p class="notice">未出貨且未回收可在單據內直接刪除；已處理單據僅能在此封存，單號不回收。</p><label class="field"><span>指定維修單號</span><input id="deleteNumber" placeholder="例如：202611-001"></label><label class="field"><span>封存原因（必填）</span><input id="deleteReason" placeholder="輸入原因"></label><button class="btn danger" onclick="softDelete()">依單號封存</button><div class="line"></div><h3>已刪除單據</h3>${state.tickets.filter(t=>t.deleted).map(t=>`<div class="item-row"><b>${esc(t.number)}</b><p class="muted">${esc(t.institution)}｜${esc(t.deletedAt||'')}</p><p class="muted">原因：${esc(t.deleteReason||'')}</p><button class="btn outline small" onclick="detail('${t.id}')">查閱原始紀錄</button></div>`).join('')||'<p class="muted">尚無已刪除單據</p>'}`)}function softDelete(){let number=document.getElementById('deleteNumber').value.trim(),reason=document.getElementById('deleteReason').value.trim(),t=state.tickets.find(x=>x.number===number&&!x.deleted);if(!t)return alert('找不到此有效單號');if(!reason)return alert('請填寫封存原因');if(!t.shipments.length&&!t.recoveries.length)return alert('尚未處理的單據請從單據詳情刪除');if(!confirm('確認將 '+number+' 移至已刪除單據？資料仍會保留。'))return;t.deleted=true;t.deletedAt=new Date().toLocaleString('zh-TW');t.deleteReason=reason;save();settingsDeleted();render()}function exportBackup(){let blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});downloadBlob(blob,'滙嘉維修資料備份-'+today()+'.json')}
function downloadBlob(blob,name){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}function exportMenu(id){modal(`<h2>選擇圖檔格式</h2><p class="muted">申請單適合傳給客服；完整紀錄供內部追蹤。</p><div style="display:grid;gap:12px;margin-top:18px"><button class="btn action-large" onclick="downloadPng('${id}','request')">維修申請單 PNG</button><button class="btn secondary action-large" onclick="downloadPng('${id}','full')">完整維修紀錄 PNG</button><button class="btn outline action-large" onclick="receiptEditor('${id}')">產品送貨／簽收單</button></div>`)}
function canvasTable(title,number,sections,filename,foot='滙嘉健康生活科技股份有限公司'){let W=1120,margin=56,usable=W-margin*2,rowH=48;let measure=document.createElement('canvas').getContext('2d');measure.font='22px sans-serif';function wrap(txt,width){let words=Array.from(String(txt??''));let out=[],line='';for(let c of words){if(measure.measureText(line+c).width>width&&line){out.push(line);line=c}else line+=c}out.push(line);return out}let rows=[];for(let sec of sections){rows.push({gap:true});rows.push({head:sec.title});let widths=sec.widths||sec.columns.map(()=>1/sec.columns.length);let total=widths.reduce((a,b)=>a+b,0);if(!sec.hideHeader)rows.push({cols:sec.columns,widths:widths.map(x=>x/total),header:true});for(let values of sec.rows){let lines=values.map((v,i)=>wrap(v,usable*widths[i]/total-24));rows.push({cols:values,widths:widths.map(x=>x/total),lines,height:Math.max(rowH,...lines.map(x=>x.length*29+18))})}}let H=195+rows.reduce((a,r)=>a+(r.gap?34:r.head?42:r.header?46:r.height),0)+100;let c=document.createElement('canvas');c.width=W;c.height=H;let ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.fillStyle='#143955';ctx.font='bold 35px sans-serif';ctx.fillText(title,margin,70);ctx.textAlign='right';ctx.font='bold 30px sans-serif';ctx.fillText(number,W-margin,70);ctx.textAlign='left';ctx.fillStyle='#64748b';ctx.font='18px sans-serif';ctx.fillText('滙嘉健康生活科技股份有限公司',margin,105);ctx.strokeStyle='#173f62';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(margin,123);ctx.lineTo(W-margin,123);ctx.stroke();let y=155;for(let r of rows){if(r.gap){y+=34;continue}if(r.head){ctx.fillStyle='#e9f1f8';ctx.fillRect(margin,y,usable,42);ctx.fillStyle='#173f62';ctx.font='bold 22px sans-serif';ctx.fillText(r.head,margin+13,y+29);ctx.strokeStyle='#b6c7d5';ctx.lineWidth=1;ctx.strokeRect(margin,y,usable,42);y+=42;continue}let h=r.header?46:r.height;ctx.fillStyle=r.header?'#edf3f8':'#fff';ctx.fillRect(margin,y,usable,h);ctx.strokeStyle='#aabaca';ctx.lineWidth=1;ctx.strokeRect(margin,y,usable,h);let x=margin;for(let i=0;i<r.cols.length;i++){let w=usable*r.widths[i];if(i){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+h);ctx.stroke()}ctx.fillStyle='#20384c';ctx.font=r.header?'bold 20px sans-serif':'20px sans-serif';let lines=r.header?[String(r.cols[i])]:r.lines[i];lines.forEach((line,j)=>ctx.fillText(line,x+12,y+29+j*29));x+=w}y+=h}ctx.fillStyle='#7a8795';ctx.font='16px sans-serif';ctx.fillText(foot,margin,H-35);c.toBlob(blob=>{if(blob)downloadBlob(blob,filename)},'image/png')}
function downloadPng(id,mode='full'){let t=get(id);let sections=[{title:'基本資料',columns:['申請日期','申請人','機構名稱'],widths:[1,1,2],rows:[[t.date,t.applicant,t.institution]]},{title:'維修申請',columns:['序號','維修申請品項','數量','維修原因'],widths:[.4,2.1,.55,2],rows:t.items.map((x,i)=>[i+1,x.name,x.qty,x.reason||''])},{title:'申請備註',columns:['備註'],rows:[[t.note||'無']]}];if(mode==='full'){sections.push({title:'各品項回收與出貨統計',columns:['品項','申請','已回收','已出貨'],widths:[2,1,1,1],rows:t.items.map((x,i)=>[x.name,x.qty,recovered(t,i),shipped(t,i)])});for(let [key,title] of [['recoveries','回收紀錄'],['shipments','出貨紀錄']])sections.push({title,columns:['日期','品項及數量','備註'],widths:[1,2,2],rows:t[key].length?t[key].map(h=>[h.date,h.lines.map(l=>`${t.items[l.index]?.name||'品項'} × ${l.qty}`).join('、'),h.note||'']):[['—','尚無紀錄','']]})}canvasTable(mode==='full'?'完整維修紀錄':'維修申請單',t.number,sections,`${t.number}-${mode==='full'?'完整維修紀錄':'維修申請單'}.png`)}
let receiptRows=[];function receiptEditor(id){let t=get(id);receiptRows=t.items.map(x=>({name:x.name,qty:x.qty,note:''}));receiptForm(id,{staff:t.applicant,unit:t.institution,phone:'',address:'',quote:'',sales:'',date:today(),note:''})}
function receiptForm(id,v){modal(`<h2>產品送貨／簽收單</h2><p class="muted">依附件「產品送貨簽收單」設計，生成公司聯與客戶聯。內容可先修改再匯出。</p><div class="cols"><label class="field"><span>服務人員</span><input id="r-staff" value="${esc(v.staff)}"></label><label class="field"><span>日期</span><input id="r-date" type="date" value="${esc(v.date)}"></label></div><label class="field"><span>收貨單位</span><input id="r-unit" value="${esc(v.unit)}"></label><div class="cols"><label class="field"><span>聯絡電話</span><input id="r-phone" value="${esc(v.phone)}"></label><label class="field"><span>報價單號</span><input id="r-quote" value="${esc(v.quote)}"></label></div><label class="field"><span>收貨地址</span><input id="r-address" value="${esc(v.address)}"></label><label class="field"><span>銷貨單號</span><input id="r-sales" value="${esc(v.sales)}"></label><h3>品號／品名・數量・備註</h3><div id="receiptRows"></div><button class="btn secondary" onclick="receiptAdd()">＋ 新增品項</button><label class="field"><span>其他備註</span><textarea id="r-note">${esc(v.note)}</textarea></label><button class="btn" style="width:100%" onclick="receiptExport('${id}')">生成雙聯簽收單 PNG</button>`);receiptRender()}
function receiptRender(){document.getElementById('receiptRows').innerHTML=receiptRows.map((x,i)=>`<div class="item-row"><b>${i+1}.</b><label class="field"><span>品號／品名</span><input value="${esc(x.name)}" oninput="receiptRows[${i}].name=this.value"></label><div class="cols"><label class="field"><span>數量</span><input type="number" min="1" value="${esc(x.qty)}" oninput="receiptRows[${i}].qty=this.value"></label><label class="field"><span>備註</span><input value="${esc(x.note)}" oninput="receiptRows[${i}].note=this.value"></label></div><button class="btn secondary small" onclick="receiptRows.splice(${i},1);receiptRender()">移除此列</button></div>`).join('')}
function receiptAdd(){receiptRows.push({name:'',qty:1,note:''});receiptRender()}

function renderProjects(){const labels={project:'專案申請單',sample:'樣品申請單',ship:'待出貨',recover:'待回收',settings:'設定'};document.getElementById('pageTitle').textContent=labels[projectTab];document.querySelector('header .muted').textContent='滙嘉健康生活科技｜專案與樣品管理';document.getElementById('fab').classList.toggle('hidden',!['project','sample'].includes(projectTab));document.getElementById('fab').onclick=()=>projectEdit();document.getElementById('nav').style.gridTemplateColumns='repeat(5,1fr)';let recoveryUnits=new Set(state.projects.filter(t=>!t.deleted&&pendingRecovery(t)).map(t=>t.institution.trim()).filter(Boolean)).size;let shipCount=state.projects.filter(t=>!t.deleted&&t.items.some((x,i)=>shipped(t,i)<Number(x.qty))).length;document.getElementById('nav').innerHTML=[['project','▤','專案申請單'],['sample','▤','樣品申請單'],['ship','📦','待出貨'],['recover','↩','待回收'],['settings','⚙','設定']].map(([id,ico,label])=>`<button class="${projectTab===id?'active':''}" onclick="go('${id}')"><span class="ico">${ico}${id==='ship'&&shipCount?`<span class="nav-count">${shipCount>99?'99+':shipCount}</span>`:''}${id==='recover'&&recoveryUnits?`<span class="nav-count">${recoveryUnits>99?'99+':recoveryUnits}</span>`:''}</span>${label}</button>`).join('');let arr=state.projects.filter(t=>!t.deleted&&matchesQuick(t)),m=document.getElementById('main');if(projectTab==='settings'){m.innerHTML=`<div class="panel"><div class="setting" onclick="numberSettings('project')"><div><b>🔢 專案申請單號格式</b><p>前綴、年月與流水號位數</p></div>›</div><div class="setting" onclick="numberSettings('sample')"><div><b>🔢 樣品申請單號格式</b><p>可與專案分別設定</p></div>›</div><div class="setting" onclick="reminderSettings()"><div><b>🔔 預計回收提醒</b><p>目前提前 ${state.reminderDays} 天提醒</p></div>›</div><div class="setting" onclick="projectProductsSettings()"><div><b>📋 專案／樣品品項</b><p>維護可選品項</p></div>›</div><div class="setting" onclick="settingsSync()"><div><b>🔑 專屬同步碼</b><p>雲端功能尚未啟用</p></div>›</div><div class="setting" onclick="projectArchive()"><div><b>🗂️ 指定單號封存／查詢</b></div>›</di function projectDateChange(){if(projectEditId)return;let date=document.getElementById('p-date').value;if(!date)return;let base=numberBase(projectTab,date);if(!projectReserved.startsWith(base)){projectReserved=allocateNumber(projectTab,date);document.getElementById('p-number').textContent=projectReserved}projectDraftSave()}
function projectSave(id,kind){let date=document.getElementById('p-date').value,applicant=document.getElementById('p-applicant').value.trim(),institution=document.getElementById('p-institution').value.trim(),order=document.getElementById('p-order')?.value.trim()||'',erpOrder=document.getElementById('p-erp')?.value.trim()||'',department=document.getElementById('p-department')?.value.trim()||'',expectedShip=document.getElementById('p-expected-ship').value,returnMode=kind==='project'?'date':document.querySelector('input[name=returnMode]:checked')?.value||'date',returnNote=kind==='sample'&&returnMode==='note'?(document.getElementById('p-return-note')?.value||''):'',expectedReturn=returnMode==='date'?document.getElementById('p-expected').value:'',otherItem=document.getElementById('p-other').checked,note=document.getElementById('p-note').value,items=projectRows.filter(x=>x.name).map(x=>({...x,qty:Number(x.qty)}));if(!date||!applicant||!institution)return alert('請填寫申請日期、申請人及機構／使用單位');if(items.some(x=>!Number.isInteger(x.qty)||x.qty<1))return alert('品項數量必須是正整數');if(!items.length&&!otherItem)return alert('請選擇申請品項，或勾選其他品項');if(otherItem&&!note.trim())return alert('勾選其他品項時，請在備註填寫品名與數量');if(!items.length&&otherItem)items=[{name:'其他品項（詳見備註）',qty:1,reason:note.trim(),otherPlaceholder:true}];let fields={date,applicant,institution,order,erpOrder,department,expectedShip,returnMode,returnNote,expectedReturn,otherItem,note,items};if(id){let t=state.projects.find(x=>x.id===id);if(t.shipments.length||t.recoveries.length)return alert('已有出貨或回收紀錄，無法修改申請');Object.assign(t,fields)}else{if(state.projects.some(x=>x.number===projectReserved&&(!x.deleted||x.shipments?.length||x.recoveries?.length)))projectReserved=allocateNumber(kind,date);state.projects.push({id:uid(),kind,number:projectReserved,...fields,shipments:[],recoveries:[],deleted:false});localStorage.removeItem('hj-proj-draft-'+kind)}save();closeModal();render()}
function projectDetail(id){let t=state.projects.find(x=>x.id===id),locked=t.shipments.length>0||t.recoveries.length>0;modal(`<div class="row between"><h2>${t.kind==='project'?'專案':'樣品'}申請單</h2>${statusBadges(t)}</div><div class="detail-number">${esc(t.number)}</div>${t.kind==='project'?`<p>訂單編號：${esc(t.order||'—')}｜ERP：${esc(t.erpOrder||'—')}</p>`:`<p>申請部門：${esc(t.department||'—')}</p>`}<p>申請日期：${esc(t.date)}｜申請人：${esc(t.applicant)}</p><p>${t.kind==='sample'?'使用單位':'機構'}：${esc(t.institution)}</p><p>預計出貨：${esc(t.expectedShip||'未設定')}</p><p>預計回收：<b>${esc(returnLabel(t))}</b></p><div class="line"></div><h3>申請品項</h3>${t.items.map((x,i)=>`<div class="item-row"><b>${i+1}. ${esc(x.name)}</b> × ${x.qty}<p class="muted">${esc(x.reason||'')}</p><p class="muted">已出貨 ${shipped(t,i)}／已回收 ${recovered(t,i)}</p></div>`).join('')}<p>其他品項：${t.otherItem?'有（詳見備註）':'無'}</p><p>備註：${esc(t.note||'—')}</p><div class="row"><button class="btn action-large" onclick="projectAction('${id}','ship')" ${t.items.every((x,i)=>shipped(t,i)>=x.qty)?'disabled':''}>出貨</button><button class="btn secondary action-large" onclick="projectAction('${id}','recover')" ${(t.kind==='sample'&&!t.shipments.length)||t.items.every((x,i)=>recovered(t,i)>=x.qty)?'disabled':''}>回收</button></div><div class="row" style="margin-top:10px">${!locked?`<button class="btn outline" onclick="projectEdit('${id}')">編輯申請</button>`:''}<button class="btn outline" onclick="editReturnDate('${id}')">修改預計回收</button><button class="btn outline" onclick="projectPng('${id}')">匯出 PNG</button>${!t.shipments.length&&!t.recoveries.length&&!t.deleted?`<button class="btn danger" onclick="projectDeleteUnprocessed('${id}')">刪除單據</button>`:''}</div><div class="line"></div><h3>出貨紀錄</h3>${history(t.shipments,t,'出貨')}<h3>回收紀錄</h3>${history(t.recoveries,t,'回收')}`)}
function editReturnDate(id){let t=state.projects.find(x=>x.id===id);let sample=t.kind==='sample',mode=returnChoice(t);modal(`<h2>修改預計回收</h2><p>${esc(t.number)}</p>${sample?`<div class="radio-choices"><label><input type="radio" name="returnMode" value="date" ${mode==='date'?'checked':''} onchange="toggleReturnInput()">選擇日期</label><label><input type="radio" name="returnMode" value="note" ${mode==='note'?'checked':''} onchange="toggleReturnInput()">自行填寫備註</label></div>`:''}<label class="field" id="return-date-field"><span>預計回收日期</span><input id="p-expected" type="date" value="${esc(t.expectedReturn||'')}"></label>${sample?`<label class="field" id="return-note-field"><span>預計回收備註</span><textarea id="p-return-note">${esc(t.returnNote||'')}</textarea></label>`:''}<button class="btn" onclick="saveReturnDate('${id}')">儲存</button>`);toggleReturnInput()}
function saveReturnDate(id){let t=state.projects.find(x=>x.id===id),mode=t.kind==='project'?'date':document.querySelector('input[name=returnMode]:checked')?.value||'date';t.returnMode=mode;t.expectedReturn=mode==='date'?document.getElementById('p-expected').value:'';t.returnNote=mode==='note'?document.getElementById('p-return-note').value:'';save();render();projectDetail(id)}
function projectAction(id,type){let t=state.projects.find(x=>x.id===id);if(type==='recover'&&t.kind==='sample'&&!t.shipments.length)return alert('樣品申請須先出貨，才能登記回收');let isShip=type==='ship',word=isShip?'出貨':'回收';modal(`<h2>${word}登記</h2><p class="muted">${esc(t.number)}</p>${t.items.map((x,i)=>{let left=x.qty-(isShip?shipped(t,i):recovered(t,i));if(!isShip&&t.kind==='sample')left=Math.min(left,shipped(t,i)-recovered(t,i));return `<div class="checkrow"><div><b>${esc(x.name)}</b><p class="muted">尚待${word} ${left}</p></div><input id="pa-${i}" type="number" min="0" max="${left}" value="0" ${left===0?'disabled':''}></div>`}).join('')}<button class="btn secondary small" onclick="document.querySelectorAll('[id^=pa-]').forEach(e=>{if(!e.disabled)e.value=e.max})">整批${word}</button><label class="field"><span>${word}日期</span><input id="pa-date" type="date" value="${today()}"></label><label class="field"><span>${word}人員</span><input id="pa-staff" placeholder="例如：客服王先生／物流人員"></label><label class="field"><span>備註</span><textarea id="pa-note" placeholder="例如：交由客服／宅配寄送">${esc(t.note||'')}</textarea></label><button class="btn" style="width:100%" onclick="projectActionSave('${id}','${type}')">確認${word}</button>`)}
function projectActionSave(id,type){let t=state.projects.find(x=>x.id===id);if(type==='recover'&&t.kind==='sample'&&!t.shipments.length)return alert('樣品須先出貨');let isShip=type==='ship',lines=[];for(let i=0;i<t.items.length;i++){let e=document.getElementById('pa-'+i),qty=Number(e.value),max=Number(e.max);if(!Number.isInteger(qty)||qty<0||qty>max)return alert('請確認出貨／回收數量');if(!isShip&&t.kind==='sample'&&qty>shipped(t,i)-recovered(t,i))return alert('樣品回收數量不可超過已出貨且尚未回收數量');if(qty)lines.push({index:i,qty})}let date=document.getElementById('pa-date').value;if(!date||!lines.length)return alert('請選擇日期及至少一項數量');(isShip?t.shipments:t.recoveries).push({date,staff:document.getElementById('pa-staff').value,note:document.getElementById('pa-note').value,lines});save();render();projectDetail(id)}
function projectPng(id){let t=state.projects.find(x=>x.id===id),isP=t.kind==='project';let shipDates=t.shipments.map(h=>h.date).join('、')||'—',shipStaff=[...new Set(t.shipments.map(h=>h.staff).filter(Boolean))].join('、')||'—',recDates=t.recoveries.map(h=>h.date).join('、')||'—',recStaff=[...new Set(t.recoveries.map(h=>h.staff).filter(Boolean))].join('、')||'—';let basics=[['申請日期',t.date],['申請人',t.applicant],[isP?'機構':'使用單位',t.institution],...(isP?[['訂單編號',t.order||'—'],['ERP 訂單編號',t.erpOrder||'—']]:[['申請部門',t.department||'—']]),['預計出貨日期',t.expectedShip||'—'],['實際出貨日期',shipDates],['送貨人員',shipStaff],['回收人員',recStaff]];let sections=[{title:'一、基本資料',columns:['欄位','內容'],hideHeader:true,widths:[1,3],rows:basics},{title:'二、出貨明細',columns:['出貨日期','品項','數量','備註'],widths:[1.1,2,0.65,2],rows:t.shipments.length?t.shipments.flatMap(h=>h.lines.map(l=>[h.date,t.items[l.index]?.name||'其他品項',l.qty,[h.staff?'送貨人員：'+h.staff:'',h.note].filter(Boolean).join('；')])):t.items.map(x=>['尚未出貨',x.name,x.qty,x.reason||'申請數量，尚未出貨'])},{title:'三、回收明細（預計回收：'+returnLabel(t)+'）',columns:['回收日期','品項','數量','備註'],widths:[1.1,2,0.65,2],rows:t.recoveries.length?t.recoveries.flatMap(h=>h.lines.map(l=>[h.date,t.items[l.index]?.name||'其他品項',l.qty,h.note||'—'])):[['尚未回收','—','—','—']]}];canvasTable(isP?'專案申請與處理紀錄':'樣品申請與處理紀錄',t.number,sections,t.number+'-專案樣品紀錄.png')}
function numberSettings(kind){let f=state.numberFormats[kind];modal(`<h2>單號格式設定｜${kind==='repair'?'維修':kind==='project'?'專案':'樣品'}</h2><label class="field"><span>前綴（可留空）</span><input id="nf-prefix" value="${esc(f.prefix)}" placeholder="例如 MW 或 AB"></label><div class="cols"><label class="field"><span>年月格式</span><select id="nf-year"><option value="YYYYMM" ${f.year==='YYYYMM'?'selected':''}>202611（四位年＋月）</option><option value="YYMM" ${f.year==='YYMM'?'selected':''}>2611（兩位年＋月）</option><option value="YYYY" ${f.year==='YYYY'?'selected':''}>2026（只顯示年）</option></select></label><label class="field"><span>分隔符號</span><select id="nf-sep"><option value="-" ${f.separator==='-'?'selected':''}>-</option><option value="_" ${f.separator==='_'?'selected':''}>_</option></select></label></div><label class="field"><span>流水號位數</span><select id="nf-digits"><option value="3" ${f.digits===3?'selected':''}>3（001）</option><option value="4" ${f.digits===4?'selected':''}>4（0001）</option></select></label><p class="notice">範例：MW-202611-001、AB-2611-001。格式變更只影響新單，舊單號不變；同類型已使用過的號碼不會重複。</p><button class="btn" onclick="saveNumberSettings('${kind}')">儲存單號格式</button>`)}
function saveNumberSettings(kind){let f={prefix:document.getElementById('nf-prefix').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,12),year:document.getElementById('nf-year').value,separator:document.getElementById('nf-sep').value,digits:Number(document.getElementById('nf-digits').value)};state.numberFormats[kind]=f;save();closeModal();render()}
function reminderSettings(){modal(`<h2>回收提醒設定</h2><label class="field"><span>預計回收日前幾天提醒</span><input id="remDays" type="number" min="0" max="365" value="${state.reminderDays}"></label><p class="notice">預設提前 30 天。此版本會在 APP 畫面標示待回收與逾期；不會在 APP 關閉時發送通知。</p><button class="btn" onclick="let v=Number(document.getElementById('remDays').value);if(!Number.isInteger(v)||v<0||v>365)return alert('請輸入 0 至 365 天');state.reminderDays=v;save();closeModal();render()">儲存提醒</button>`)}
function projectProductsSettings(){modal(`<h2>專案／樣品品項</h2>${state.projectProducts.map((x,i)=>`<div class="item-row row between"><span>${esc(x)}</span><button class="btn secondary small" onclick="state.projectProducts.splice(${i},1);save();projectProductsSettings()">停用</button></div>`).join('')}<label class="field"><span>新增品項</span><input id="pp-new"></label><button class="btn" onclick="let v=document.getElementById('pp-new').value.trim();if(v&&!state.projectProducts.includes(v)){state.projectProducts.push(v);save()}projectProductsSettings()">新增</button>`)}
function projectDeleteUnprocessed(id){let t=state.projects.find(x=>x.id===id);if(!t||t.deleted)return;if(t.shipments.length||t.recoveries.length)return alert('已有出貨或回收紀錄，請到設定中封存');if(!confirm('刪除 '+t.number+'？尚未處理的單據將移除，單號可再次使用。'))return;state.projects=state.projects.filter(x=>x.id!==id);save();closeModal();render()}
function projectArchive(){modal(`<h2>已處理單據封存</h2><p class="notice">未出貨、未回收的單據可在單據內直接刪除，流水號可回補。已有處理紀錄的單據僅能在這裡封存，單號不再使用。</p><label class="field"><span>指定單號</span><input id="pr-del"></label><label class="field"><span>封存原因（必填）</span><input id="pr-reason"></label><button class="btn danger" onclick="projectArchiveSave()">封存單據</button><h3>已封存單據</h3>${state.projects.filter(x=>x.deleted).map(t=>`<div class="item-row" onclick="projectDetail('${t.id}')">${esc(t.number)}｜${esc(t.deleteReason)}　查看 ›</div>`).join('')||'<p class="muted">無</p>'}`)}
function projectArchiveSave(){let n=document.getElementById('pr-del').value.trim(),r=document.getElementById('pr-reason').value.trim(),t=state.projects.find(x=>x.number===n&&!x.deleted);if(!t||!r)return alert('請填有效單號與原因');if(!t.shipments.length&&!t.recoveries.length)return alert('此單尚未處理，請從單據詳情直接刪除');if(confirm('確定封存？原始紀錄仍保留，單號不可重複使用。')){t.deleted=true;t.deleteReason=r;t.deletedAt=new Date().toISOString();save();projectArchive();render()}}
const oldSettingsFormat=settingsFormat;settingsFormat=function(){modal(`<h2>維修設定</h2><div class="setting" onclick="numberSettings('repair')"><b>🔢 維修單號格式設定</b> ›</div><label class="field"><span>單據標題</span><input id="formatTitle" value="${esc(state.title)}"></label><button class="btn" onclick="state.title=document.getElementById('formatTitle').value.trim()||'維修申請單';save();closeModal();render()">儲存標題</button>`)};
// 修復切回維修模式時底部欄位
const v4Render=render;render=function(){document.getElementById('nav').style.gridTemplateColumns=mode==='repair'?'repeat(4,1fr)':'repeat(5,1fr)';document.getElementById('fab').onclick=mode==='repair'?()=>editTicket():()=>projectEdit();if(mode==='repair')document.querySelector('header .muted').textContent='滙嘉健康生活科技｜維修申請管理';v4Render()};

render();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script></body></html>
