let draft=[];function editTicket(id){let t=id?get(id):null;editingId=id||null;let old=!t?readDraft():null;draft=t?t.items.map((x,i)=>({...x,__sourceIndex:i})).filter(x=>!x.otherPlaceholder):old?.items?.length?old.items.filter(x=>!x.otherPlaceholder):[{name:'',qty:'',reason:''}];repairOtherRows=t?t.items.map((x,i)=>({...x,__sourceIndex:i})).filter(x=>x.otherPlaceholder).map(x=>({name:x.name.replace(/^其他品項：/,''),qty:x.qty,reason:x.reason||'',__sourceIndex:x.__sourceIndex})):old?.otherItems?.length?old.otherItems:[{name:'',qty:1,reason:''}];repairOtherEnabled=!!(t?t.items.some(x=>x.otherPlaceholder):old?.otherItem);reservedNumber=t?.number||old?.number||nextNumber(today());if(!t&&old?.date&&!reservedNumber.startsWith(numberBase('repair',old.date)))reservedNumber=nextNumber(old.date);modal(`<div class="row between"><h2>${t?'編輯維修單':'新增維修單'}</h2><div class="detail-number" id="reservedNumber">${esc(reservedNumber)}</div></div>${old?'<div class="notice">已恢復 2 分鐘內尚未儲存的內容。</div>':''}<div class="cols"><label class="field"><span>申請日期 *</span><input id="f-date" type="date" value="${esc(t?.date||old?.date||today())}" onchange="refreshReserved()"></label><label class="field"><span>申請人 *</span><input id="f-person" value="${esc(t?.applicant||old?.applicant||'')}"></label></div><label class="field"><span>機構名稱 *</span><input id="f-inst" value="${esc(t?.institution||old?.institution||'')}"></label><div class="line"></div><h3>維修申請</h3><div id="draftRows"></div><button class="btn secondary" onclick="addRow()">＋ 增加申請格</button><div class="hj-other-toggle hj-other-switch-row"><span>其他品項（可不選上方品項）</span><label class="hj-switch" aria-label="維修其他品項開關"><input id="f-other" type="checkbox" ${repairOtherEnabled?'checked':''} onchange="repairOtherEnabled=this.checked;renderRepairOtherRows();persistDraft()"><span class="hj-switch-track"></span></label></div><div id="f-other-field"><div id="f-other-rows"></div><button type="button" class="btn secondary small" onclick="repairOtherRows.push({name:'',qty:1,reason:''});renderRepairOtherRows();persistDraft()">＋ 新增其他品項</button></div><label class="field"><span>備註（自由輸入）</span><textarea id="f-note">${esc(t?.note||old?.note||'')}</textarea></label><button class="btn" style="width:100%" onclick="saveTicket('${id||''}')">儲存維修單</button>`);renderRows();renderRepairOtherRows();if(!t){document.querySelector('.sheet').addEventListener('input',persistDraft);document.querySelector('.sheet').addEventListener('change',persistDraft);persistDraft()}}
function renderRows(){document.getElementById('draftRows').innerHTML=draft.map((x,i)=>`<div class="item-row"><div class="row between"><span class="item-title">${i+1}.</span>${draft.length>1?`<button class="btn secondary small" onclick="removeRow(${i})">移除</button>`:''}</div><label class="field"><span>維修品項</span><select onchange="draft[${i}].name=this.value;persistDraft()">${optionList(x.name)}</select></label><div class="cols"><label class="field"><span>數量（選品項後必填）</span><input type="number" min="1" step="1" value="${esc(x.qty)}" oninput="draft[${i}].qty=this.value;persistDraft()"></label><label class="field"><span>維修原因（選填）</span><input value="${esc(x.reason)}" oninput="draft[${i}].reason=this.value;persistDraft()" placeholder="故障原因"></label></div></div>`).join('')}function renderRepairOtherRows(){let field=document.getElementById('f-other-field'),el=document.getElementById('f-other-rows');if(!field||!el)return;field.style.display=repairOtherEnabled?'block':'none';el.innerHTML=repairOtherRows.map((x,i)=>`<div class="item-row hj-other-row"><div class="row between"><b>其他品項 ${i+1}.</b><button type="button" class="btn secondary small" onclick="repairOtherRows.splice(${i},1);if(!repairOtherRows.length){repairOtherEnabled=false;document.getElementById('f-other').checked=false}renderRepairOtherRows();persistDraft()">移除</button></div><label class="field"><span>名稱 *</span><input value="${esc(x.name||'')}" placeholder="請填寫名稱" oninput="repairOtherRows[${i}].name=this.value;persistDraft()"></label><div class="cols"><label class="field"><span>數量 *</span><input type="number" min="1" step="1" value="${esc(x.qty??1)}" oninput="repairOtherRows[${i}].qty=this.value;persistDraft()"></label><label class="field"><span>維修原因（選填）</span><input value="${esc(x.reason||'')}" placeholder="故障原因" oninput="repairOtherRows[${i}].reason=this.value;persistDraft()"></label></div></div>`).join('')}
function addRow(){draft.push({name:'',qty:'',reason:''});renderRows();persistDraft()}function removeRow(i){draft.splice(i,1);renderRows();persistDraft()}function saveTicket(id){let date=document.getElementById('f-date').value,applicant=document.getElementById('f-person').value.trim(),institution=document.getElementById('f-inst').value.trim(),note=document.getElementById('f-note').value.trim();let items=draft.filter(x=>x.name);let others=repairOtherEnabled?repairOtherRows:[];if(!date||!applicant||!institution||(!items.length&&!others.length))return alert('請填寫申請日期、申請人、機構及至少一項維修品項。');if(items.some(x=>!Number.isInteger(Number(x.qty))||Number(x.qty)<=0))return alert('每個已選維修品項都必須填寫大於 0 的整數數量。');if(others.some(x=>!String(x.name||'').trim()||!Number.isInteger(Number(x.qty))||Number(x.qty)<=0))return alert('請正確填寫其他品項名稱與數量。');items=[...items.map(x=>({name:x.name,qty:Number(x.qty),reason:x.reason||''})),...others.map(x=>({name:'其他品項：'+String(x.name).trim(),qty:Number(x.qty),reason:x.reason||'',otherPlaceholder:true}))];if(id){let t=get(id);if(t.shipments.length||t.recoveries.length)return alert('已有出貨或回收紀錄，不可修改');Object.assign(t,{date,applicant,institution,note,items})}else{if(state.tickets.some(x=>x.number===reservedNumber&&(!x.numberReusable)))reservedNumber=nextNumber(date);state.tickets.push({id:uid(),number:reservedNumber,date,applicant,institution,note,items,shipments:[],recoveries:[],deleted:false})}save();if(!id)clearDraft();closeModal();tab='tickets';render()}
function detail(id){let t=get(id),locked=t.shipments.length>0||t.recoveries.length>0;modal(`<div class="row between"><h2>${esc(state.title)}</h2>${statusBadges(t)}</div><div class="detail-number">${esc(t.number)}</div><p class="muted">申請日期：${esc(t.date)}｜申請人：${esc(t.applicant)}</p><p><b>機構：</b>${esc(t.institution)}</p><div class="line"></div><h3>維修申請</h3>${t.items.map((x,i)=>`<div class="item-row hj-detail-item"><span class="hj-detail-index">${i+1}.</span><div class="hj-detail-item-body"><div><b>${esc(x.name)}</b><span class="hj-detail-qty">× ${x.qty}</span></div><p class="muted">維修原因：${esc(x.reason||'—')}</p><p class="muted">已回收 ${recovered(t,i)}／已出貨 ${shipped(t,i)}</p></div></div>`).join('')}<p><b>備註：</b>${esc(t.note||'—')}</p><div class="notice">${locked?'此單已有出貨或回收紀錄，申請內容已鎖定。':'尚未出貨／回收，申請內容可修改。'} 回收與出貨歷史獨立保存。</div><div class="hj-detail-actions"><div class="hj-detail-action-grid"><button class="btn action-large" onclick="actionForm('${id}','ship')" ${t.items.every((x,i)=>shipped(t,i)>=x.qty)?'disabled':''}>出貨</button><button class="btn secondary action-large" onclick="actionForm('${id}','recover')" ${t.items.every((x,i)=>recovered(t,i)>=x.qty)?'disabled':''}>回收</button><button class="btn outline" onclick="exportMenu('${id}')">匯出JPG</button>${!locked?`<button class="btn outline" onclick="editTicket('${id}')">編輯</button>`:''}${state.receiptEnabled?`<button class="btn outline" onclick="receiptEditor('${id}')">簽收單</button>`:``}</div></div><div class="line"></div><h3>回收紀錄</h3>${history(t.recoveries,t,'回收')}<div class="line"></div><h3>編輯紀錄</h3>${(t.editHistory||[]).map(h=>`<div class="history"><b>${esc(new Date(h.at).toLocaleString('zh-TW'))}</b>${h.changes.map(c=>c.field==='新增品項'?`<p>新增：${c.items.map(x=>esc(x.name)+' × '+x.qty).join('、')}</p>`:`<p>${esc(({note:'備註',applicant:'申請人',institution:'機構／使用單位',expectedReturn:'預計回收日期',expectedShip:'預計出貨日期'})[c.field]||c.field)}：${esc(c.from||'—')} → ${esc(c.to||'—')}</p>`).join('')}</div>`).join('')||'<p class="muted">尚無編輯紀錄</p>'}<div class="line"></div><h3>出貨紀錄</h3>${history(t.shipments,t,'出貨')}${!locked&&!t.deleted?`<div class="hj-detail-delete"><button class="btn danger" onclick="repairDeleteUnprocessed('${id}')">刪除單據</button></div>`:''}`)}function history(arr,t,word){return arr.length?arr.map((h,i)=>`<div class="history"><b>第 ${i+1} 次${word}｜${esc(h.date)}</b><p style="font-size:13px">${h.lines.map(l=>`${esc(t.items[l.index]?.name||'品項')} × ${l.qty}${word==='回收'?'（'+(l.condition==='good'?'良品':l.condition==='bad'?'不良品':'未註明品況')+'）':''}`).join('、')}</p><p class="muted">${h.staff?esc(word==='出貨'?'維修客服：':'回收客服：')+esc(h.staff)+'｜':''}${esc(h.note||'無備註')}</p></div>`).join(''):`<p class="muted">尚無${word}紀錄</p>`}
function hjReturnToggle(i){const toggle=document.getElementById('a-good-toggle-'+i),panel=document.getElementById('a-split-'+i),single=document.getElementById('a-'+i);if(!toggle||!panel||!single)return;panel.hidden=!toggle.checked;single.closest('label.field').hidden=toggle.checked;single.disabled=toggle.checked||Number(single.max)===0;if(toggle.checked){const bad=document.getElementById('a-bad-'+i),good=document.getElementById('a-good-'+i);bad.value=single.value||'0';good.value='0';hjReturnUpdate(i)}else{single.value=document.getElementById('a-bad-'+i).value||'0'}}
function hjReturnUpdate(i){const bad=document.getElementById('a-bad-'+i),good=document.getElementById('a-good-'+i),msg=document.getElementById('a-total-'+i);if(!bad||!good||!msg)return;const max=Number(bad.max),n=Number(bad.value)+Number(good.value);msg.textContent=`已填 ${n}／可回收 ${max}`;msg.style.color=Number.isInteger(n)&&n<=max&&n>=0?'':'#b42318'}
function actionForm(id,type){const t=get(id),isShip=type==='ship',word=isShip?'出貨':'回收';if(isShip&&t.items.every((x,i)=>shipped(t,i)>=x.qty))return alert('此單已全部出貨');if(!isShip&&t.items.every((x,i)=>recovered(t,i)>=x.qty))return alert('此單已全部回收');const available=t.items.map((x,i)=>x.qty-(isShip?shipped(t,i):recovered(t,i)));modal(`<h2>新增${word}紀錄</h2><p class="muted">維修單號：${esc(t.number)}</p><div class="notice">${isShip?'可一次出貨全部剩餘品項，也可只出貨部分數量。':'預設全部為不良品；若同一品項有良品，開啟「有良品回收」即可一次填寫兩種數量。'}</div><div class="panel"><h3>選擇${word}品項與數量</h3>${t.items.map((x,i)=>`<div class="hj-return-item"><div class="hj-return-item-head"><div><b>${esc(x.name)}</b><p class="muted">申請 ${x.qty}｜${isShip?'尚待出貨':'尚待回收'} ${available[i]}</p></div>${!isShip?`<label class="hj-return-switch"><span>有良品回收</span><input id="a-good-toggle-${i}" type="checkbox" role="switch" aria-label="${esc(x.name)} 啟用有良品回收" ${available[i]<=0?'disabled':''} onchange="hjReturnToggle(${i})"><span class="hj-return-track" aria-hidden="true"></span></label>`:''}</div><label class="field"><span>${isShip?'出貨數量':'不良品回收數量'}</span><input id="a-${i}" type="number" min="0" max="${available[i]}" step="1" value="0" ${available[i]<=0?'disabled':''}></label>${!isShip?`<div class="hj-return-split" id="a-split-${i}" hidden><div class="hj-return-two"><label class="field"><span>不良品數量</span><input id="a-bad-${i}" type="number" min="0" max="${available[i]}" step="1" value="0" oninput="hjReturnUpdate(${i})"></label><label class="field"><span>良品數量</span><input id="a-good-${i}" type="number" min="0" max="${available[i]}" step="1" value="0" oninput="hjReturnUpdate(${i})"></label></div><p class="muted" id="a-total-${i}">已填 0／可回收 ${available[i]}</p></div>`:''}</div>`).join('')}<button class="btn secondary small" onclick="fillAll()">整批${word}（填入全部剩餘數量）</button></div><label class="field"><span>${word}日期 *</span><input type="date" id="a-date" value="${today()}"></label><label class="field"><span>${isShip?'維修客服':'回收客服'}</span><input id="a-staff" placeholder="請輸入客服姓名"></label><label class="field"><span>${word}備註（選填）</span><textarea id="a-note" placeholder="例如：宅配寄出／交由某位客服／現場收回"></textarea></label><button class="btn" style="width:100%" onclick="saveAction('${id}','${type}')">確認${word}</button>`)}
function fillAll(){document.querySelectorAll('input[type=number][id^="a-"]').forEach(x=>{if(!x.disabled&&!x.id.startsWith('a-good-')&&!x.id.startsWith('a-bad-'))x.value=x.max});document.querySelectorAll('[id^="a-good-toggle-"]').forEach(toggle=>{if(toggle.checked){const i=toggle.id.slice('a-good-toggle-'.length);document.getElementById('a-bad-'+i).value=document.getElementById('a-bad-'+i).max;document.getElementById('a-good-'+i).value='0';hjReturnUpdate(i)}})}
function saveAction(id,type){const t=get(id),isShip=type==='ship',arr=isShip?t.shipments:t.recoveries,date=document.getElementById('a-date').value,note=document.getElementById('a-note').value.trim(),lines=[];for(let i=0;i<t.items.length;i++){const available=t.items[i].qty-(isShip?shipped(t,i):recovered(t,i)),toggle=!isShip&&document.getElementById('a-good-toggle-'+i)?.checked;let entries;if(toggle){entries=[['bad',Number(document.getElementById('a-bad-'+i).value)],['good',Number(document.getElementById('a-good-'+i).value)]]}else{entries=[[isShip?null:'bad',Number(document.getElementById('a-'+i).value)]]}const total=entries.reduce((sum,e)=>sum+e[1],0);if(entries.some(e=>!Number.isInteger(e[1])||e[1]<0)||total>available)return alert(`${t.items[i].name}：良品與不良品數量合計不可超過尚待${isShip?'出貨':'回收'}數量 ${available}，且必須是非負整數。`);for(const [condition,qty] of entries)if(qty>0)lines.push(isShip?{index:i,qty}:{index:i,qty,condition})}if(!date||!lines.length)return alert('請填寫日期，並至少選擇一個數量大於 0 的品項');arr.push({date,note,staff:document.getElementById('a-staff').value.trim(),lines});save();closeModal();render();detail(id)}
function settingsProducts(){modal(`<h2>維修申請項目管理</h2><div id="productList">${state.products.map((x,i)=>`<div class="row between item-row"><span>${esc(x)}</span><button class="btn secondary small" onclick="removeProduct(${i})">停用</button></div>`).join('')}</div><label class="field"><span>新增維修品項</span><input id="newProduct" placeholder="例如：智慧光纖薄墊感測線"></label><button class="btn" onclick="addProduct()">新增品項</button><div class="notice">停用只會從未來新增維修單的下拉選單移除，不影響既有紀錄。</div>`)}function addProduct(){let v=document.getElementById('newProduct').value.trim();if(!v)return;if(state.products.includes(v))return alert('此品項已存在');state.products.push(v);save();settingsProducts()}function removeProduct(i){if(!confirm('停用此品項？舊維修單不受影響。'))return;state.products.splice(i,1);save();settingsProducts()}function settingsFormat(){modal(`<h2>維修單格式設定</h2><label class="field"><span>單據標題</span><input id="formatTitle" value="${esc(state.title)}"></label><div class="notice">單號固定顯示在右上角；每列申請格含維修品項、數量與維修原因。未出貨可編輯，出貨後鎖定。</div><button class="btn" onclick="state.title=document.getElementById('formatTitle').value.trim()||'維修申請單';save();closeModal()">儲存格式</button>`)}function settingsSync(){modal(`<h2>專屬同步碼</h2><div class="notice"><b>雲端同步尚未啟用。</b> 此畫面是正式版配對流程預覽，下面的代碼不會同步資料，請勿當作真實同步憑證。</div><p>正式版預計：第一台裝置產生高強度配對密鑰，其他手機或電腦輸入密鑰後，連接同一份雲端資料。</p><div class="code">尚未連接雲端</div><p class="muted">正式版需部署雲端資料庫、安全權限與配對機制。</p>`)}function repairDeleteUnprocessed(id){let t=get(id);if(!t||t.deleted)return;if(t.shipments.length||t.recoveries.length)return alert('已有處理紀錄，請在設定封存');if(!confirm('確定刪除 '+t.number+'？此單號可再次使用。'))return;state.tickets=state.tickets.filter(x=>x.id!==id);save();closeModal();render()}function settingsDeleted(){modal(`<h2>已處理維修單封存／查詢</h2><p class="notice">未出貨且未回收可在單據內直接刪除；已處理單據僅能在此封存，單號不回收。</p><label class="field"><span>指定維修單號</span><input id="deleteNumber" placeholder="例如：202611-001"></label><label class="field"><span>封存原因（必填）</span><input id="deleteReason" placeholder="輸入原因"></label><button class="btn danger" onclick="softDelete()">依單號封存</button><div class="line"></div><h3>已刪除單據</h3>${state.tickets.filter(t=>t.deleted).map(t=>`<div class="item-row"><b>${esc(t.number)}</b><p class="muted">${esc(t.institution)}｜${esc(t.deletedAt||'')}</p><p class="muted">原因：${esc(t.deleteReason||'')}</p><button class="btn outline small" onclick="detail('${t.id}')">查閱原始紀錄</button></div>`).join('')||'<p class="muted">尚無已刪除單據</p>'}`)}function softDelete(){let number=document.getElementById('deleteNumber').value.trim(),reason=document.getElementById('deleteReason').value.trim(),t=state.tickets.find(x=>x.number===number&&!x.deleted);if(!t)return alert('找不到此有效單號');if(!reason)return alert('請填寫封存原因');if(!t.shipments.length&&!t.recoveries.length)return alert('尚未處理的單據請從單據詳情刪除');if(!confirm('確認將 '+number+' 移至已刪除單據？資料仍會保留。'))return;t.deleted=true;t.deletedAt=new Date().toLocaleString('zh-TW');t.deleteReason=reason;save();settingsDeleted();render()}function exportBackup(){hjBackupDialog()}
let currentJpgBlob=null,currentJpgName='',currentJpgUrl='';

 if(currentJpgUrl)URL.revokeObjectURL(currentJpgUrl);

function hjRecoveryReportNote(h,t){
 const good=(h.lines||[]).filter(l=>l.condition==='good'&&Number(l.qty)>0);
 const summary=good.map(l=>`${t.items[l.index]?.name||'品項'} × ${l.qty}（良品回收）`).join('；');

function hjRepairEditHistoryReportRows(t){
 const entries=Array.isArray(t.editHistory)?t.editHistory:[];
 if(!entries.length)return [['—','尚無編輯紀錄','']];
 const names={date:'申請日期',applicant:'申請人',institution:'機構名稱',note:'申請備註',reason:'維修原因'};
 const rows=[];
 for(const h of entries){
  const when=h.at?new Date(h.at).toLocaleString('zh-TW',{hour12:false}):(h.date||'—');
  const changes=Array.isArray(h.changes)?h.changes:[];
  if(!changes.length){rows.push([when,'修改紀錄','']);continue}
  for(const c of changes){
   if(c.field==='新增品項'){
    const added=(c.items||[]).map(x=>`${x.name||'品項'} × ${x.qty??''}`).join('、');
    rows.push([when,'新增品項',added]);
   }else if(c.field&&c.field.startsWith('刪除品項')){
    rows.push([when,c.field,`${c.from??'—'} → ${c.to??'已刪除'}`]);
   }else{
    rows.push([when,names[c.field]||c.field||'修改',`${c.from===undefined||c.from===''?'—':c.from} → ${c.to===undefined||c.to===''?'—':c.to}`]);
   }
  }
 }
 return rows;
}

function projectDraftSave(){if(projectEditId||!document.getElementById('p-date'))return;let kind=projectTab;let obj={updated:Date.now(),number:projectReserved,date:document.getElementById('p-date').value,applicant:document.getElementById('p-applicant').value,institution:document.getElementById('p-institution').value,order:document.getElementById('p-order')?.value||'',erpOrder:document.getElementById('p-erp')?.value||'',orderType:document.getElementById('p-order-type')?.value||'',department:document.getElementById('p-department')?.value||'',expectedShip:document.getElementById('p-expected-ship').value,returnMode:document.querySelector('input[name=returnMode]:checked')?.value||'date',returnNote:document.getElementById('p-return-note')?.value||'',expectedReturn:document.getElementById('p-expected').value,otherItem:document.getElementById('p-other').checked,otherItemName:projectOtherRows[0]?.name||'',otherItems:structuredClone(projectOtherRows),note:document.getElementById('p-note').value,items:projectRows};localStorage.setItem('hj-proj-draft-'+kind,JSON.stringify(obj))}

function projectSave(id,kind){
 let date=document.getElementById('p-date').value,applicant=document.getElementById('p-applicant').value.trim(),institution=document.getElementById('p-institution').value.trim(),order=document.getElementById('p-order')?.value.trim()||'',erpOrder=document.getElementById('p-erp')?.value.trim()||'',orderType=kind==='project'?(document.getElementById('p-order-type')?.value||''):'',department=document.getElementById('p-department')?.value.trim()||'',expectedShip=document.getElementById('p-expected-ship').value,returnMode=kind==='project'?'date':document.querySelector('input[name=returnMode]:checked')?.value||'date',returnNote=kind==='sample'&&returnMode==='note'?(document.getElementById('p-return-note')?.value||''):'',expectedReturn=returnMode==='date'?document.getElementById('p-expected').value:'',otherItem=document.getElementById('p-other').checked,otherItemName=projectOtherRows[0]?.name.trim()||'',note=document.getElementById('p-note').value;
 let regular=projectRows.filter(x=>x.name).map(x=>({...x,qty:Number(x.qty)}));
 let otherItems=otherItem?projectOtherRows.map(x=>({...x,name:String(x.name||'').trim(),qty:Number(x.qty),reason:String(x.reason||'').trim()})):[];
 if(!date||!applicant||!institution)return alert('請填寫申請日期、申請人及機構／使用單位');
 if(regular.some(x=>!Number.isInteger(x.qty)||x.qty<1))return alert('品項數量必須是正整數');
 if(otherItem&&otherItems.some(x=>!x.name||!Number.isInteger(x.qty)||x.qty<1))return alert('請正確填寫其他品項名稱與數量');
 let items=[...regular,...otherItems.map(x=>({...x,name:'其他品項：'+x.name,otherPlaceholder:true}))];
 if(!items.length)return alert('目前沒有申請品項；請至少新增一個品項後再儲存。若要取消整張未出貨申請單，請使用刪除單據功能。');
 let fields={date,applicant,institution,order,erpOrder,orderType,department,expectedShip,returnMode,returnNote,expectedReturn,otherItem,otherItemName,otherItems:otherItems.map(({__sourceIndex,...x})=>x),note};
 if(id){
  let t=state.projects.find(x=>x.id===id);if(!t)return alert('找不到申請單');
  if(projectFullyRecovered(t))return alert('此單已全部回收完畢，不能再編輯');
  const original=t.items||[],processed=!!(t.shipments.length||t.recoveries.length);
  if(processed){
   let kept=new Set(items.filter(x=>Number.isInteger(x.__sourceIndex)).map(x=>x.__sourceIndex));
   for(let i=0;i<original.length;i++){
    if(shipped(t,i)>0&&!kept.has(i))return alert('已出貨的品項不可刪除');
   }
   for(const x of items){
    if(!Number.isInteger(x.__sourceIndex))continue;
    let old=original[x.__sourceIndex];
    if(!old||old.name!==x.name||Number(old.qty)!==x.qty||String(old.reason||'')!==String(x.reason||''))return alert('既有品項不可更改名稱或數量，未出貨品項可以移除後重新新增');
   }
   fields.date=t.date;
  }
  const removed=original.map((x,i)=>({...x,__oldIndex:i})).filter(x=>!items.some(y=>y.__sourceIndex===x.__oldIndex));
  const added=items.filter(x=>!Number.isInteger(x.__sourceIndex)).map(x=>({name:x.name,qty:x.qty,reason:x.reason||''}));
  const changes=[];
  for(const k of ['applicant','institution','order','erpOrder','orderType','department','expectedShip','expectedReturn','returnNote','note'])if(String(t[k]||'')!==String(fields[k]||''))changes.push({field:k,from:t[k]||'',to:fields[k]||''});
  if(removed.length)changes.push({field:'刪除品項',items:removed.map(x=>({name:x.name,qty:x.qty,reason:x.reason||''}))});
  if(added.length)changes.push({field:'新增品項',items:added});
  // 重建索引時同步更新出貨與回收紀錄，避免刪除未出貨品項造成歷史紀錄錯位。
  const mapping=new Map();items.forEach((x,i)=>{if(Number.isInteger(x.__sourceIndex))mapping.set(x.__sourceIndex,i)});
  for(const batch of [...t.shipments,...t.recoveries])for(const line of batch.lines||[]){
   if(!mapping.has(line.index))return alert('紀錄索引異常，為保護歷史資料，已取消本次儲存');
  }
  for(const batch of [...t.shipments,...t.recoveries])for(const line of batch.lines||[])line.index=mapping.get(line.index);
  fields.items=items.map(({__sourceIndex,...x})=>x);
  if(changes.length){t.editHistory=t.editHistory||[];t.editHistory.push({at:new Date().toISOString(),date:today(),changes})}
  Object.assign(t,fields);
 }else{
  if(state.projects.some(x=>x.number===projectReserved&&(!x.numberReusable)))projectReserved=allocateNumber(kind,date);
  state.projects.push({id:uid(),kind,number:projectReserved,...fields,items:items.map(({__sourceIndex,...x})=>x),shipments:[],recoveries:[],deleted:false});
  localStorage.removeItem('hj-proj-draft-'+kind);
 }
 save();closeModal();render();
}

function projectFullyRecovered(t){return !!(t.shipments?.length||t.recoveries?.length)&&t.items.length>0&&t.items.every((x,i)=>recovered(t,i)>=Number(x.qty))}
function projectEditHistoryHtml(t){
 const entries=Array.isArray(t.editHistory)?t.editHistory:[];
 if(!entries.length)return '<p class="muted">尚無編輯紀錄</p>';
 const names={applicant:'申請人',institution:'機構／使用單位',order:'訂單編號',erpOrder:'ERP 訂單編號',orderType:'訂單類型',department:'申請部門',expectedShip:'預計出貨日期',expectedReturn:'預計回收日期',returnNote:'預計回收備註',note:'備註'};
 return entries.map(e=>{

let hjPickerKey=null;
let hjPickerHSV={h:0,s:0,v:1};
function hjHexToHsv(hex){const [rr,gg,bb]=hjRgb(hex).map(x=>x/255),mx=Math.max(rr,gg,bb),mn=Math.min(rr,gg,bb),d=mx-mn;let h=0;if(d){if(mx===rr)h=((gg-bb)/d)%6;else if(mx===gg)h=(bb-rr)/d+2;else h=(rr-gg)/d+4;h=(h*60+360)%360}return {h,s:mx?d/mx:0,v:mx}}
function hjHsvToHex({h,s,v}){let c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c,r=0,g=0,b=0;if(h<60)[r,g,b]=[c,x,0];else if(h<120)[r,g,b]=[x,c,0];else if(h<180)[r,g,b]=[0,c,x];else if(h<240)[r,g,b]=[0,x,c];else if(h<300)[r,g,b]=[x,0,c];else [r,g,b]=[c,0,x];return '#'+[r,g,b].map(z=>Math.round((z+m)*255).toString(16).padStart(2,'0')).join('')}
function hjOpenPicker(key){if(!['bg','card','ink','accent','strong'].includes(key))return;const host=document.getElementById('hj-picker-host');if(!host)return;if(hjPickerKey===key){host.innerHTML='';hjPickerKey=null;return}hjPickerKey=key;hjPickerHSV=hjHexToHsv(document.getElementById('hj-color-'+key).value);host.innerHTML=`<div class="hj-picker"><div class="hj-picker-square" id="hj-picker-square" onpointerdown="hjPickerPoint(event)"><div class="hj-picker-cursor" id="hj-picker-cursor"></div></div><div class="hj-picker-bottom"><span class="hj-picker-swatch" id="hj-picker-swatch"></span><input aria-label="色相" type="range" min="0" max="360" value="${Math.round(hjPickerHSV.h)}" class="hj-picker-hue" id="hj-picker-hue" oninput="hjPickerHue(this.value)"></div><div class="hj-picker-rgb">${['R','G','B'].map((c,i)=>`<label>${c}<input type="number" min="0" max="255" inputmode="numeric" id="hj-picker-rgb-${i}" oninput="hjPickerRgb()"></label>`).join('')}</div><button type="button" class="btn secondary hj-picker-done" onclick="hjOpenPicker('${key}')">完成選色</button></div>`;hjPickerPaint();}
function hjPickerPaint(){if(!hjPickerKey)return;const hex=hjHsvToHex(hjPickerHSV),sq=document.getElementById('hj-picker-square'),cursor=document.getElementById('hj-picker-cursor'),swatch=document.getElementById('hj-picker-swatch');if(!sq)return;sq.style.backgroundColor=hjHsvToHex({h:hjPickerHSV.h,s:1,v:1});cursor.style.left=(hjPickerHSV.s*100)+'%';cursor.style.top=((1-hjPickerHSV.v)*100)+'%';swatch.style.background=hex;const hue=document.getElementById('hj-picker-hue');if(hue)hue.value=Math.round(hjPickerHSV.h);hjRgb(hex).forEach((v,i)=>{const el=document.getElementById('hj-picker-rgb-'+i);if(el&&document.activeElement!==el)el.value=v});const input=document.getElementById('hj-color-'+hjPickerKey);if(input)input.value=hex;const chip=document.getElementById('hj-chip-'+hjPickerKey),text=document.getElementById('hj-hex-'+hjPickerKey);if(chip)chip.style.background=hex;if(text)text.textContent=hex.toUpperCase();previewHjTheme()}
function hjPickerPoint(e){const sq=document.getElementById('hj-picker-square');if(!sq)return;const rect=sq.getBoundingClientRect();hjPickerHSV.s=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width));hjPickerHSV.v=1-Math.max(0,Math.min(1,(e.clientY-rect.top)/rect.height));hjPickerPaint();if(e.type==='pointerdown'){sq.setPointerCapture(e.pointerId);sq.addEventListener('pointermove',hjPickerMove);sq.addEventListener('pointerup',hjPickerStop,{once:true});sq.addEventListener('pointercancel',hjPickerStop,{once:true})}}
function hjPickerMove(e){hjPickerPoint(e)}
function hjPickerStop(e){e.currentTarget.removeEventListener('pointermove',hjPickerMove)}
function hjPickerHue(v){hjPickerHSV.h=Number(v);hjPickerPaint()}
function hjPickerRgb(){const inputs=[0,1,2].map(i=>document.getElementById('hj-picker-rgb-'+i));if(inputs.some(x=>!x||x.value===''))return;const hex='#'+inputs.map(x=>Math.max(0,Math.min(255,Number(x.value)||0)).toString(16).padStart(2,'0')).join('');hjPickerHSV=hjHexToHsv(hex);hjPickerPaint()}

/* V6 — 品項資料管理（品號／品名／備註／啟用狀態） */
(function initProductCatalog(){
  if(!state.productCatalog||typeof state.productCatalog!=='object')state.productCatalog={};
  for(const kind of ['repair','project']){
    const legacy=kind==='repair'?state.products:state.projectProducts;
    if(!Array.isArray(state.productCatalog[kind]))state.productCatalog[kind]=(legacy||[]).map((name,i)=>({id:kind+'-legacy-'+i,code:'',name:String(name),note:'',enabled:true}));
    // 舊版清單只儲存品名；首次更新時保留既有品項，不覆蓋已有詳細資料。
    state.productCatalog[kind]=state.productCatalog[kind].filter(x=>x&&x.name).map((x,i)=>({id:x.id||kind+'-item-'+i,code:String(x.code||''),name:String(x.name),note:String(x.note||''),enabled:x.enabled!==false}));
  }
  save();
})();
function catalogFor(kind){return state.productCatalog[kind==='repair'?'repair':'project']}
function syncLegacyProducts(){state.products=catalogFor('repair').filter(x=>x.enabled).map(x=>x.name);state.projectProducts=catalogFor('project').filter(x=>x.enabled).map(x=>x.name);save()}
function catalogOptions(kind,current){let items=catalogFor(kind).filter(x=>x.enabled||x.name===current);let seen=new Set();let result='<option value="">請選擇品項</option>';for(const x of items){if(seen.has(x.name))continue;seen.add(x.name);result+=`<option value="${esc(x.name)}" ${current===x.name?'selected':''}>${esc(x.name)}${x.enabled?'':'（已停用）'}</option>`}if(current&&!seen.has(current))result+=`<option value="${esc(current)}" selected>${esc(current)}（歷史品項）</option>`;return result}
function productHelpButton(kind){return `<button type="button" class="hj-help" onclick="showProductHelp('${kind}')" title="查看品號、品名及備註" aria-label="查看品項參考資料">參考</button>`}
function showProductHelp(kind){document.getElementById('hj-product-help')?.remove();let items=catalogFor(kind);let pane=document.createElement('div');pane.id='hj-product-help';pane.className='hj-help-backdrop';pane.innerHTML=`<div class="hj-help-sheet" role="dialog" aria-modal="true" aria-label="品項參考"><div class="row between"><h3>品項參考資料</h3><button type="button" class="btn secondary small" onclick="closeProductHelp()">關閉 ×</button></div><p class="muted">申請單僅顯示品名；此處可查詢品號、品名與備註。</p><input class="hj-help-search" placeholder="搜尋品號、品名或備註" oninput="filterProductHelp(this.value)"><div id="hj-help-items">${productHelpRows(items)}</div></div>`;pane.addEventListener('click',e=>{if(e.target===pane)closeProductHelp()});document.body.appendChild(pane);pane.querySelector('input').focus()}
function productHelpRows(items){return items.length?items.map(x=>`<div class="hj-help-item"><div><b>${esc(x.name)}</b> ${x.enabled?'':'<span class="hj-off">已停用</span>'}</div><div><small>品號</small> ${esc(x.code||'未設定')}</div><div><small>備註</small> ${esc(x.note||'—')}</div></div>`).join(''):'<p class="muted">尚無品項資料</p>'}
function filterProductHelp(value){let kind=mode==='repair'?'repair':'project',q=value.trim().toLowerCase();document.getElementById('hj-help-items').innerHTML=productHelpRows(catalogFor(kind).filter(x=>[x.code,x.name,x.note].join(' ').toLowerCase().includes(q)))}

/* V57: offline Excel item import; match by product code; preview before commit. */
let catalogImportPending=null;
function catalogImportPick(kind){
  let el=document.getElementById('hj-catalog-xlsx-file');
  if(!el){el=document.createElement('input');el.id='hj-catalog-xlsx-file';el.type='file';el.accept='.xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';el.style.display='none';document.body.appendChild(el)}
  el.value='';el.onchange=()=>{if(el.files?.[0])catalogImportRead(kind,el.files[0])};el.click();
}
function hjXlsxText(node){return [...node.getElementsByTagName('*')].filter(x=>x.localName==='t').map(x=>x.textContent||'').join('')}
function hjXlsxChildren(node,name){return [...node.children].filter(x=>x.localName===name)}
async function catalogImportRead(kind,file){
  if(file.name!=='品項建立.xlsx')return alert('請選擇檔名為「品項建立.xlsx」的 Excel 檔案。');
  if(file.size>10*1024*1024)return alert('檔案超過 10 MB，請縮小後再匯入。');
  if(typeof JSZip==='undefined')return alert('Excel 讀取元件尚未載入，請重新整理 APP 後再試。');
  try{
    const zip=await JSZip.loadAsync(file),parser=new DOMParser();
    const readXml=async path=>{const f=zip.file(path);if(!f)throw Error('缺少 Excel 必要資料：'+path);const doc=parser.parseFromString(await f.async('string'),'application/xml');if(doc.querySelector('parsererror'))throw Error('Excel XML 格式錯誤');return doc};
    const wb=await readXml('xl/workbook.xml'),rels=await readXml('xl/_rels/workbook.xml.rels');
    const relMap=new Map([...rels.getElementsByTagName('*')].filter(x=>x.localName==='Relationship').map(x=>[x.getAttribute('Id'),x.getAttribute('Target')]));
    const sheets=[...wb.getElementsByTagName('*')].filter(x=>x.localName==='sheet');
    let sheetPath='';for(const sheet of sheets){const rid=sheet.getAttribute('r:id')||sheet.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');let target=relMap.get(rid);if(target){sheetPath=target.startsWith('/')?target.slice(1):target.startsWith('xl/')?target:'xl/'+target;break}}
    if(!sheetPath)throw Error('找不到 Excel 工作表');
    let strings=[];if(zip.file('xl/sharedStrings.xml')){const shared=await readXml('xl/sharedStrings.xml');strings=[...shared.getElementsByTagName('*')].filter(x=>x.localName==='si').map(hjXlsxText)}
    const sheet=await readXml(sheetPath),xmlRows=[...sheet.getElementsByTagName('*')].filter(x=>x.localName==='row');
    const rows=xmlRows.map(row=>{let obj={};for(const c of hjXlsxChildren(row,'c')){const ref=c.getAttribute('r')||'',col=(ref.match(/^[A-Z]+/)||[])[0];if(!col)continue;const type=c.getAttribute('t');let val='';if(type==='inlineStr')val=hjXlsxText(c);else{const v=hjXlsxChildren(c,'v')[0]?.textContent||'';val=type==='s'?strings[Number(v)]??'':v}obj[col]=String(val).trim()}return obj}).filter(x=>Object.values(x).some(Boolean));
    if(!rows.length||rows[0].A!=='品號'||rows[0].B!=='品名'||rows[0].C!=='備註')throw Error('第一列欄位必須依序為「品號、品名、備註」。');
    const existing=catalogFor(kind),existingByCode=new Map(existing.filter(x=>x.code?.trim()).map(x=>[x.code.trim(),x]));
    const seen=new Set(),changes=[],errors=[];let skipped=0;
    rows.slice(1).forEach((row,i)=>{
      const code=(row.A||'').trim(),name=(row.B||'').trim(),note=(row.C||'').trim(),line=i+2;
      if(!code&&!name&&!note)return;
      if(!code||!name){errors.push(`第 ${line} 列：品號與品名不可空白`);return}
      if(seen.has(code)){errors.push(`第 ${line} 列：Excel 內品號「${code}」重複`);return}seen.add(code);
      const match=existingByCode.get(code);
      if(match){if(match.name===name&&match.note===note){skipped++;return}
        if(existing.some(x=>x.id!==match.id&&x.name===name)){errors.push(`第 ${line} 列：品名「${name}」已由其他品號使用`);return}
        changes.push({action:'update',id:match.id,code,name,note,oldName:match.name});
      }else{
        if(existing.some(x=>x.name===name)||changes.some(x=>x.name===name)){errors.push(`第 ${line} 列：品名「${name}」已存在，請先確認原品項的品號`);return}
        changes.push({action:'add',code,name,note});
      }
    });
    if(errors.length)throw Error('資料檢查未通過，尚未匯入：\n'+errors.slice(0,8).join('\n')+(errors.length>8?`\n另有 ${errors.length-8} 筆錯誤`:''));
    catalogImportPending={kind,changes};
    const add=changes.filter(x=>x.action==='add').length,update=changes.length-add;
    modal(`<h2>匯入品項預覽</h2><p class="muted">檔案：品項建立.xlsx　｜　${kind==='repair'?'維修':'專案／樣品'}品項</p><div class="notice">新增 ${add} 筆、更新 ${update} 筆、內容相同略過 ${skipped} 筆。依品號比對，不刪除未列於 Excel 的品項。</div><div class="hj-import-preview">${changes.slice(0,50).map(x=>`<div class="hj-import-line"><b>${x.action==='add'?'新增':'更新'}</b>　${esc(x.code)}　${esc(x.name)}${x.oldName&&x.oldName!==x.name?`<small>（原品名：${esc(x.oldName)}）</small>`:''}</div>`).join('')||'<p>沒有需要變更的品項。</p>'}</div>${changes.length>50?`<p class="muted">僅預覽前 50 筆，共 ${changes.length} 筆變更。</p>`:''}<div class="row"><button class="btn" onclick="catalogImportCommit()" ${changes.length?'':'disabled'}>確認匯入</button><button class="btn secondary" onclick="catalogImportPending=null;catalogSettings('${kind}')">取消</button></div>`);
  }catch(e){catalogImportPending=null;alert('Excel 匯入失敗：'+(e?.message||e))}
}
function catalogImportCommit(){
  const p=catalogImportPending;if(!p)return;
  const list=catalogFor(p.kind);
  for(const x of p.changes){if(x.action==='add')list.push({id:'cat-'+uid(),code:x.code,name:x.name,note:x.note,enabled:true});else{const old=list.find(a=>a.id===x.id);if(old)Object.assign(old,{name:x.name,note:x.note})}}

}

/* V17: keep settings arrangement independent of ticket data. */
const HJ_SETTING_ORDER_KEY='hj-settings-order-v17';

/* V110: editable unshipped repair lines, immutable shipped lines, indexed history remap. */
function hjRepairLockedLine(t,i){return shipped(t,i)>0}

renderRows=function(){
 const t=editingId?get(editingId):null;
 document.getElementById('draftRows').innerHTML=draft.map((x,i)=>{
  const locked=!hjRepairLineEditable(t,x),old=hjRepairOldLine(t,x);
  return `<div class="item-row"><div class="row between"><span class="item-title">${i+1}. ${locked?'<small>（已出貨，鎖定）</small>':''}</span>${!locked?`<button type="button" class="btn secondary small" onclick="removeRow(${i})">移除</button>`:''}</div>

  <label class="field"><span>維修原因（選填）</span><input value="${esc(x.reason)}" ${locked?'readonly':''} oninput="draft[${i}].reason=this.value;persistDraft()"></label></div></div>`;
 }).join('');
};
renderRepairOtherRows=function(){
 const field=document.getElementById('f-other-field'),el=document.getElementById('f-other-rows');
 if(!field||!el)return;
 const t=editingId?get(editingId):null;
 field.style.display=repairOtherEnabled?'block':'none';
 el.innerHTML=repairOtherRows.map((x,i)=>{
  const locked=!hjRepairLineEditable(t,x);
  return `<div class="item-row hj-other-row"><div class="row between"><b>其他品項 ${i+1}. ${locked?'（已出貨，鎖定）':''}</b>${locked?'':`<button type="button" class="btn secondary small" onclick="repairOtherRows.splice(${i},1);renderRepairOtherRows();persistDraft()">移除</button>`}</div>
  <label class="field"><span>名稱 *</span><input value="${esc(x.name||'')}" ${locked?'readonly':''} oninput="repairOtherRows[${i}].name=this.value;persistDraft()"></label>
  <div class="cols"><label class="field"><span>數量 *</span><input type="number" min="1" step="1" value="${esc(x.qty??1)}" ${locked?'readonly':''} oninput="repairOtherRows[${i}].qty=this.value;persistDraft()"></label>
  <label class="field"><span>維修原因（選填）</span><input value="${esc(x.reason||'')}" ${locked?'readonly':''} oninput="repairOtherRows[${i}].reason=this.value;persistDraft()"></label></div></div>`;
 }).join('');
};
saveTicket=function(id){
 const date=document.getElementById('f-date').value,applicant=document.getElementById('f-person').value.trim(),institution=document.getElementById('f-inst').value.trim(),note=document.getElementById('f-note').value.trim();
 const regular=draft.filter(x=>x.name),others=repairOtherEnabled?repairOtherRows:[];
 if(!date||!applicant||!institution||(!regular.length&&!others.length))return alert('請填寫申請日期、申請人、機構及至少一項維修品項。');
 if([...regular,...others].some(x=>!Number.isInteger(Number(x.qty))||Number(x.qty)<1)||others.some(x=>!String(x.name||'').trim()))return alert('請正確填寫品項名稱及大於 0 的整數數量。');
 const proposed=[...regular.map(x=>({...x,name:x.name,qty:Number(x.qty),reason:x.reason||''})),...others.map(x=>({...x,name:'其他品項：'+String(x.name).trim(),qty:Number(x.qty),reason:x.reason||'',otherPlaceholder:true}))];

 if(id){
  const t=get(id);if(!t)return alert('找不到維修單');
  const oldItems=t.items,seen=new Set(),changes=[],newItems=[];
  for(const x of proposed){
   if(Number.isInteger(x.__sourceIndex)){
    const i=x.__sourceIndex,old=oldItems[i];if(!old||seen.has(i))return alert('品項對應異常，請重新開啟編輯');
    seen.add(i);
    if(hjRepairLockedLine(t,i)&&(old.name!==x.name||old.qty!==x.qty||(old.reason||'')!==(x.reason||'')))return alert('已出貨的品項不可修改');
    if(x.qty<Math.max(shipped(t,i),recovered(t,i)))return alert('數量不可小於已出貨或已回收數量');
    for(const [key,label] of [['name','品名'],['qty','數量'],['reason','維修原因']]){
     if(String(old[key]||'')!==String(x[key]||''))changes.push({field:`品項 ${i+1} ${label}`,from:String(old[key]??''),to:String(x[key]??'')});
    }
   }else changes.push({field:'新增品項',items:[clean(x)]});
   newItems.push(clean(x));

/* Pointer long-press reorder: works with iPhone touch, mouse and stylus. */
function hjBindSettingsDrag(list){
 if(!list)return;
 let hold=null,drag=null,originY=0,lastY=0,preventClick=false;
 const rows=()=>Array.from(list.querySelectorAll('.hj-setting-sort'));
 function clearHold(){if(hold){clearTimeout(hold.timer);hold=null}}
 function finish(commit){
  clearHold();
  if(!drag)return;
  const active=drag;drag=null;
  document.body.classList.remove('hj-sort-active');
  active.row.classList.remove('hj-dragging');
  active.handle.style.touchAction='pan-y';
  if(commit){const ids=rows().map(x=>x.dataset.settingId);hjSaveSettingOrder(list.dataset.orderKind||hjSettingsMode(),ids);window.hjCurrentSettingsOrder=ids;}
  preventClick=true;
  setTimeout(()=>{preventClick=false},250);
 }
 list.addEventListener('click',e=>{if(preventClick){e.preventDefault();e.stopPropagation()}},true);
 list.addEventListener('pointerdown',e=>{
  const handle=e.target.closest('[data-hj-handle]');if(!handle||e.button!==0)return;
  clearHold();originY=e.clientY;lastY=e.clientY;
  const row=handle.closest('.hj-setting-sort');
  hold={id:e.pointerId,row,handle,timer:setTimeout(()=>{
    if(!hold||hold.id!==e.pointerId)return;
    drag={id:e.pointerId,row,handle};hold=null;
    row.classList.add('hj-dragging');document.body.classList.add('hj-sort-active');
    handle.style.touchAction='none';
    if(navigator.vibrate)navigator.vibrate(15);
  },350)};
 });
 document.addEventListener('pointermove',e=>{
  if(hold&&hold.id===e.pointerId&&Math.abs(e.clientY-originY)>9)clearHold();
  if(!drag||drag.id!==e.pointerId)return;
  e.preventDefault();lastY=e.clientY;
  const items=rows(),target=items.find(x=>x!==drag.row&&e.clientY>=x.getBoundingClientRect().top&&e.clientY<=x.getBoundingClientRect().bottom);
  if(target){const rect=target.getBoundingClientRect();list.insertBefore(drag.row,e.clientY<rect.top+rect.height/2?target:target.nextSibling)}
 },{passive:false});
 document.addEventListener('pointerup',e=>{if(hold&&hold.id===e.pointerId)clearHold();if(drag&&drag.id===e.pointerId)finish(true)});
 document.addEventListener('pointercancel',e=>{if(hold&&hold.id===e.pointerId)clearHold();if(drag&&drag.id===e.pointerId)finish(true)});
 list.addEventListener('keydown',e=>{
  const handle=e.target.closest('[data-hj-handle]');if(!handle||!e.altKey||!['ArrowUp','ArrowDown'].includes(e.key))return;
  e.preventDefault();const row=handle.closest('.hj-setting-sort');const items=rows(),i=items.indexOf(row),j=i+(e.key==='ArrowUp'?-1:1);
  if(j<0||j>=items.length)return;

  const ids=rows().map(x=>x.dataset.settingId);hjSaveSettingOrder(hjSettingsMode(),ids);window.hjCurrentSettingsOrder=ids;handle.focus();
 });
}

function hjRepairReportDialog(){
 const d=new Date(),y=d.getFullYear();
 modal(`<h2>維修單資料報表</h2><p class="muted">依「申請維修日期」篩選；超過結束日才交貨的維修單仍納入。</p><label class="field"><span>開始日期</span><input id="hj-report-start" type="date" value="${y}-01-01"></label><label class="field"><span>結束日期</span><input id="hj-report-end" type="date" value="${today()}"></label><div class="notice">輸出五個工作表：統計總覽、維修品項、故障類型、維修時間、維修明細。格式採用最新提供的標楷體範本。已封存／刪除單據不列入。</div><div class="row"><button class="btn" onclick="hjExportRepairReport()">匯出 Excel 維修總表</button><button class="btn secondary" onclick="hjExportRepairSummaryJpg()">匯出 JPG 維修總表</button></div><div class="line"></div><h3>待出貨／待回收報表</h3><label class="field"><span><input id="hj-pending-all" type="checkbox" checked style="width:auto;height:auto;margin-right:8px">統計全部日期（取消勾選則依上方日期區間）</span></label><p class="muted">統計目前尚未完成的品項；出貨與回收各自依申請數量扣除實際紀錄，列出待出貨及待回收數量。日期區間可選擇；留空則統計全部。</p><div class="row"><button class="btn secondary" onclick="hjExportPendingRepair('xlsx')">匯出 Excel</button><button class="btn secondary" onclick="hjExportPendingRepair('jpg')">匯出 JPG</button></div>`);
}
function hjRepairDate(v){const s=String(v||'').trim();const m=s.match(/^(\d{4})[-\/]?(\d{2})[-\/]?(\d{2})/);return m?`${m[1]}-${m[2]}-${m[3]}`:''}
function hjReportPeriod(start,end){const f=s=>String(s||'').replace(/^(\d{4})-(\d{2})-(\d{2})$/,(_,y,m,d)=>`${y}-${Number(m)}-${Number(d)}`);return `${f(start)}~${f(end)}`}
function hjDayDiff(a,b){return Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/86400000)}
function hjReportRows(start,end){
 const tickets=state.tickets.filter(t=>!t.deleted&&hjRepairDate(t.date)>=start&&hjRepairDate(t.date)<=end);
 const items=new Map(),reasons=new Map(),details=[],durations=[];let qtyTotal=0,complete=0;
 for(const t of tickets){
  const date=hjRepairDate(t.date),shipments=Array.isArray(t.shipments)?t.shipments:[];
  let allSent=(t.items||[]).length>0, last='';
  for(let i=0;i<(t.items||[]).length;i++){
   const it=t.items[i],qty=Number(it.qty)||0,name=String(it.name||'未命名品項'),reason=String(it.reason||'未填寫').trim()||'未填寫';
   const sent=shipments.reduce((s,h)=>s+(h.lines||[]).filter(l=>Number(l.index)===i).reduce((n,l)=>n+(Number(l.qty)||0),0),0);
   const hits=shipments.filter(h=>(h.lines||[]).some(l=>Number(l.index)===i&&Number(l.qty)>0)).map(h=>hjRepairDate(h.date)).filter(Boolean).sort();
   const shipDate=sent>=qty&&qty>0?hits[hits.length-1]||'':'';
   if(sent<qty||!shipDate)allSent=false;
   if(shipDate&&shipDate>last)last=shipDate;
   qtyTotal+=qty;items.set(name,(items.get(name)||0)+qty);reasons.set(reason,(reasons.get(reason)||0)+1);
   details.push([String(t.number||''),date,String(t.institution||''),name,qty,reason,shipDate,shipDate?hjDayDiff(date,shipDate):'',shipDate?'已交貨':'未完成']);
  }
  if(allSent&&last){complete++;durations.push(hjDayDiff(date,last))}
 }
 const ordered=m=>[...m].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'zh-TW'));
 return {tickets,qtyTotal,complete,durations,details,items:ordered(items),reasons:ordered(reasons)};
}

 if(typeof JSZip==='undefined')return alert('Excel 元件尚未載入，請確認 jszip.min.js 已上傳至 GitHub。');

/* V75: Repair outstanding shipment / recovery reports. Calculations are by item and original line index. */
function hjPendingRepairData(){
 const all=document.getElementById('hj-pending-all')?.checked!==false;
 const start=document.getElementById('hj-report-start')?.value||'',end=document.getElementById('hj-report-end')?.value||'';
 if(!all&&(!start||!end||start>end))throw Error('請輸入正確的日期區間');
 const rows=[],byProduct=new Map(),tickets=new Set();
 for(const t of state.tickets||[]){
  if(t.deleted)continue;
  const date=hjRepairDate(t.date);
  if(!all&&(date<start||date>end))continue;
  (t.items||[]).forEach((it,i)=>{
   const qty=Math.max(0,Number(it.qty)||0);
   const sent=Math.min(qty,Math.max(0,shipped(t,i)));
   // 維修單的回收與出貨為獨立紀錄；回收可早於出貨。
   // 與單據詳情及「待回收」頁面一致，以申請數量扣除實際已回收數量。
   const returned=Math.min(qty,Math.max(0,recovered(t,i)));
   const pendingShip=Math.max(0,qty-sent),pendingReturn=Math.max(0,qty-returned);
   if(!pendingShip&&!pendingReturn)return;
   const name=String(it.name||'未命名品項');tickets.add(t.id||t.number);
   const old=byProduct.get(name)||{name,ship:0,recover:0};old.ship+=pendingShip;old.recover+=pendingReturn;byProduct.set(name,old);
   rows.push([String(t.number||''),String(t.applicant||''),String(t.institution||''),name,qty,date,
    returned>=qty?'已回收':returned>0?'部分回收':'待回收',sent>=qty?'已出貨':sent>0?'部分出貨':'待出貨',pendingShip,pendingReturn]);
  });
 }
 const summary=[...byProduct.values()].sort((a,b)=>(b.ship+b.recover)-(a.ship+a.recover)||a.name.localeCompare(b.name,'zh-TW'));
 return {rows,summary,ticketCount:tickets.size,ship:summary.reduce((s,x)=>s+x.ship,0),recover:summary.reduce((s,x)=>s+x.recover,0),period:all?'全部日期':start+' 至 '+end,generated:new Date().toLocaleDateString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit'})};
}

function hjProjectReportJpg(d){

 function lines(value,w){ctx.font=`23px ${font}`;let result=[],line='';for(const ch of Array.from(String(value??''))){if(line&&ctx.measureText(line+ch).width>w-24){result.push(line);line=ch}else line+=ch}result.push(line);return result}
 function rh(vals,weights){const sum=weights.reduce((a,b)=>a+b,0);return Math.max(56,...vals.map((v,i)=>lines(v,inner*weights[i]/sum).length*32+20))}
 const heights=sections.map(sec=>sec.rows.map(r=>rh(r,sec.weights)));
 let H=205;sections.forEach((sec,i)=>{H+=120+heights[i].reduce((a,b)=>a+b,0)+(sec.rows.length?0:56)+38});H+=55;
 cv.width=W;cv.height=H;ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#263c50';ctx.font=`bold 44px ${font}`;ctx.fillText('滙嘉健康生活科技｜'+d.title,margin,72);
 ctx.fillStyle='#64748b';ctx.font=`25px ${font}`;ctx.fillText(`報表生成日期：${d.generated}　　表單期間：${d.period}`,margin,125);

async function hjDownloadFullBackup(){

  const mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if(mobile&&navigator.share&&navigator.canShare){
   try{

     await navigator.share({files:[file],title:'滙嘉管理 APP 完整資料備份'});

function hjRestoreValidate(d){

 const v=d.format==='huijia-full-backup'?d.state:(d.state&&d.exported_at?d.state:d);
 if(!v||typeof v!=='object'||!Array.isArray(v.tickets)||!Array.isArray(v.projects)||!Array.isArray(v.products))throw Error('檔案不是完整的滙嘉管理 APP 備份，缺少必要資料');
 if(v.counter!==undefined&&(typeof v.counter!=='object'||v.counter===null))throw Error('單號計數器格式錯誤');
 if(v.tickets.some(t=>!t||typeof t!=='object'||!Array.isArray(t.items)||!Array.isArray(t.shipments)||!Array.isArray(t.recoveries)))throw Error('維修單格式不完整');
 if(v.projects.some(t=>!t||typeof t!=='object'||!Array.isArray(t.items)||!Array.isArray(t.shipments)||!Array.isArray(t.recoveries)))throw Error('專案／樣品單格式不完整');
 if(JSON.stringify(v).length>15*1024*1024)throw Error('備份資料超過 15 MB，請聯繫管理員處理');

  if(!Array.isArray(rows)||rows.length!==1){hjAutoStatus('版本衝突・已暫停，請手動處理');return}

/* V104: adjustable polling and pull-to-refresh. */
const HJ_SYNC_FREQ_KEY='hj-cloud-sync-seconds-v104';
let hjSyncPollTimer=null;
function hjSyncGetInterval(){const n=Number(localStorage.getItem(HJ_SYNC_FREQ_KEY));return [5,10,15,30,60].includes(n)?n:10}
function hjSyncStartPolling(){clearInterval(hjSyncPollTimer);hjSyncPollTimer=setInterval(()=>{if(!document.hidden)hjAutoSync()},hjSyncGetInterval()*1000)}
function hjSyncSetInterval(v){const n=Number(v);if(![5,10,15,30,60].includes(n))return;localStorage.setItem(HJ_SYNC_FREQ_KEY,String(n));hjSyncStartPolling();hjAutoStatus('同步頻率已設為每 '+n+' 秒');hjAutoSyncSoon()}
hjSyncStartPolling();
(function hjPullSync(){
 const style=document.createElement('style');style.textContent=`#hj-pull-sync{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translate(-50%,-140px);transition:transform .18s ease;z-index:10001;pointer-events:none;border-radius:30px;background:rgba(245,247,250,.97);border:1px solid #c9d5df;color:#45576c;padding:9px 18px;font-size:13px;box-shadow:0 3px 16px #0002}#hj-pull-sync.hj-visible{transform:translate(-50%,0)}`;document.head.appendChild(style);
 const tip=document.createElement('div');tip.id='hj-pull-sync';tip.setAttribute('role','status');tip.textContent='↓ 下拉以同步';document.body.appendChild(tip);
 let startY=0,startX=0,tracking=false,ready=false;
 function eligible(target){return !document.hidden&&(document.getElementById('hj-cloud-gate')?.hidden!==false)&&!document.body.classList.contains('modal-open')&&!target.closest('input,textarea,select,button,a,[contenteditable],.nav,.top-search')}
 // Main content scrolls on some layouts; both the page and content must be at the top.
 function atTop(){const main=document.getElementById('main');return window.scrollY<=2&&(!main||main.scrollTop<=2)}
 document.addEventListener('touchstart',e=>{tracking=false;ready=false;if(e.touches.length!==1||!eligible(e.target)||!atTop())return;startY=e.touches[0].clientY;startX=e.touches[0].clientX;tracking=true},{passive:true});
 document.addEventListener('touchmove',e=>{if(!tracking||e.touches.length!==1)return;const dy=e.touches[0].clientY-startY,dx=e.touches[0].clientX-startX;if(dy<0||Math.abs(dx)>Math.abs(dy)*.7){tracking=false;tip.classList.remove('hj-visible');return}if(dy>35){ready=dy>=95;tip.textContent=ready?'↻ 放開立即同步':'↓ 繼續下拉以同步';tip.classList.add('hj-visible')}},{passive:true});
 document.addEventListener('touchend',()=>{const trigger=tracking&&ready;tracking=false;ready=false;tip.classList.remove('hj-visible');if(trigger){tip.textContent='☁ 同步檢查中…';tip.classList.add('hj-visible');hjAutoSync();setTimeout(()=>tip.classList.remove('hj-visible'),1200)}},{passive:true});
 document.addEventListener('touchcancel',()=>{tracking=false;ready=false;tip.classList.remove('hj-visible')},{passive:true});
})();

/* V117: only newest issued document may release its number. Earlier cancellations retain number. */
function hjDocCollection(t){return t.kind==='project'||t.kind==='sample'?state.projects:state.tickets}
function hjLatestIssued(t){
 // Cascade deletion: skip only the deleted, reusable tail of the issuance ledger.
 // A voided (non-reusable) document remains a barrier, even after trash purge.
 const kind=t.kind||'repair';
 const ledger=(state.hjIssuedLedger||[]).filter(x=>x.kind===kind);
 const list=hjDocCollection(t);
 if(ledger.length){
  for(let i=ledger.length-1;i>=0;i--){
   const entry=ledger[i];
   const doc=list.find(x=>x.id===entry.id);
   const reusable=doc?!!(doc.deleted&&doc.numberReusable):entry.numberReusable===true;
   if(reusable)continue;
   return entry.id===t.id;
  }
  return false;
 }
 const sameKind=list.filter(x=>(x.kind||'repair')===kind);
 for(let i=sameKind.length-1;i>=0;i--){
  const doc=sameKind[i];
  if(doc.deleted&&doc.numberReusable)continue;
  return doc.id===t.id;
 }
 return false;
}
function hjRepairOldReusableNumbers(){
 // Safety migration: V117 could mark the last number of an older month reusable.
 // Such records must not release their numbers once a later document exists.
 let changed=false;
 for(const list of [state.tickets,state.projects]){
  for(let i=0;i<list.length;i++){
   const t=list[i];if(!t.deleted||!t.numberReusable)continue;
   const kind=t.kind||'repair';
   const ledger=(state.hjIssuedLedger||[]).filter(x=>x.kind===kind);const pos=ledger.findIndex(x=>x.id===t.id);const hasLater=pos>=0?pos<ledger.length-1:list.slice(i+1).some(x=>(x.kind||'repair')===kind);
   if(hasLater){t.numberReusable=false;t.deleteReason='已刪除（單號保留，不可沿用）';changed=true;}
  }
 }
 if(changed)save();
}

function hjMayReuseNumber(t){return !t.deleted&&!t.shipments?.length&&!t.recoveries?.length&&hjLatestIssued(t)}
function hjDeleteOrCancel(id,kind){
 const list=kind==='repair'?state.tickets:state.projects,t=list.find(x=>x.id===id);
 if(!t||t.deleted)return;
 if(t.shipments?.length||t.recoveries?.length)return alert('已有出貨或回收紀錄，無法取消此單據');
 const reuse=hjMayReuseNumber(t);
 const label=reuse?'刪除單據':'作廢此單據';
 if(!confirm(`${label}：${t.number}？\n${reuse?'此為最新單據，刪除後單號可再次使用。':'此為較早建立的單據，將保留取消紀錄，單號永久不可沿用。'}`))return;
 t.deleted=true;t.deletedAt=new Date().toISOString();t.deleteReason=reuse?'最新單據刪除':'作廢此單據';t.numberReusable=reuse;
 const issued=(state.hjIssuedLedger||[]).find(x=>x.id===t.id);if(issued)issued.numberReusable=reuse;
 save();closeModal();render();
}
repairDeleteUnprocessed=function(id){hjDeleteOrCancel(id,'repair')};
projectDeleteUnprocessed=function(id){hjDeleteOrCancel(id,'project')};
/* V119: recycle bin with optional automatic retention. Tombstones protect numbering after purge. */
function hjTrashInit(){
 state.hjTrashMonths=Number.isInteger(state.hjTrashMonths)&&[0,1,3,6,12,24].includes(state.hjTrashMonths)?state.hjTrashMonths:6;
 state.hjIssuedLedger??=[];state.hjPurgedNumbers??=[];
 for(const entry of state.hjIssuedLedger){
  const doc=[...state.tickets,...state.projects].find(x=>x.id===entry.id);
  if(doc)entry.numberReusable=!!(doc.deleted&&doc.numberReusable);
 }
 const ids=new Set(state.hjIssuedLedger.map(x=>x.id));
 for(const t of [...state.tickets,...state.projects])if(!ids.has(t.id)){
  state.hjIssuedLedger.push({id:t.id,kind:t.kind||'repair',number:t.number,numberReusable:!!(t.deleted&&t.numberReusable)});ids.add(t.id);
 }
}
function hjTrashPurgeOne(t,kind){
 const list=kind==='repair'?state.tickets:state.projects;
 if(!t||!t.deleted)return false;
 // Keep a permanent number reservation for every non-reusable document.
 if(!t.numberReusable&&!state.hjPurgedNumbers.some(x=>x.kind===(t.kind||'repair')&&x.number===t.number))
  state.hjPurgedNumbers.push({kind:t.kind||'repair',number:t.number});
 const issued=(state.hjIssuedLedger||[]).find(x=>x.id===t.id);if(issued)issued.numberReusable=!!t.numberReusable;
 const idx=list.findIndex(x=>x.id===t.id);if(idx<0)return false;
 list.splice(idx,1);return true;
}
function hjTrashExpiry(t){
 const d=new Date(t.deletedAt||'');if(!Number.isFinite(d.getTime()))return null;
 const result=new Date(d.getTime());result.setMonth(result.getMonth()+state.hjTrashMonths);return result;
}
function hjTrashAutoPurge(){
 hjTrashInit();if(state.hjTrashMonths===0)return 0;
 let count=0;
 for(const [kind,list] of [['repair',state.tickets],['project',state.projects]]){
  for(const t of [...list]){
   const expiry=t.deleted&&hjTrashExpiry(t);
   if(expiry&&expiry.getTime()<=Date.now()&&hjTrashPurgeOne(t,kind))count++;
  }
 }
 if(count)save();return count;
}
function hjTrashSetMonths(){
 const v=Number(document.getElementById('hj-trash-months')?.value);
 if(![0,1,3,6,12,24].includes(v))return alert('請選擇保留期限');
 if(v!==0&&!confirm('設定後，已超過保留期限的單據將在下次清理時永久刪除，且無法從 APP 復原。確定儲存？'))return;
 state.hjTrashMonths=v;save();hjDeletedRecords(hjTrashViewKind||'repair');
}
let hjTrashViewKind='repair';
function hjTrashManualPurge(id,kind){
 const list=kind==='repair'?state.tickets:state.projects,t=list.find(x=>x.id===id&&x.deleted);if(!t)return alert('找不到此已刪除單據');
 if(!confirm('確定永久刪除「'+t.number+'」？\n原始單據、出貨、回收與編輯紀錄都會移除，無法復原。單號保留規則不變。'))return;
 if(!confirm('再次確認：永久刪除後只能透過先前的 JSON 備份復原。確定繼續？'))return;
 hjTrashInit();hjTrashPurgeOne(t,kind);save();hjDeletedRecords(kind);
}
function hjTrashPurgeExpiredNow(kind){
 if(state.hjTrashMonths===0)return alert('目前設定為永久保留，請先設定期限');
 if(!confirm('立即清除所有已超過保留期限的回收桶單據？此操作無法復原。'))return;
 const n=hjTrashAutoPurge();hjDeletedRecords(kind);alert(n?'已永久刪除 '+n+' 筆過期單據':'目前沒有過期單據');
}
function hjDeletedRecords(kind){
 hjTrashViewKind=kind;hjTrashInit();
 const list=kind==='repair'?state.tickets:state.projects;
 const rows=list.filter(x=>x.deleted).slice().reverse();
 const opts=[[0,'永久保留'],[1,'1 個月'],[3,'3 個月'],[6,'6 個月（預設）'],[12,'1 年'],[24,'2 年']].map(([n,l])=>`<option value="${n}" ${state.hjTrashMonths===n?'selected':''}>${l}</option>`).join('');
 modal(`<h2>已刪除單據查詢｜回收桶｜${kind==='repair'?'維修':'專案／樣品'}</h2>
 <p class="notice">只清除已刪除／不出貨的單據。永久刪除後無法從 APP 復原；不可沿用的單號仍永久保留占號紀錄。請先匯出 JSON 備份。</p>
 <label class="field"><span>回收桶自動刪除保留期限（依刪除日期計算）</span><select id="hj-trash-months">${opts}</select></label>
 <div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn secondary small" onclick="hjTrashSetMonths()">儲存保留期限</button><button class="btn outline small" onclick="hjTrashPurgeExpiredNow('${kind}')">立即清理過期單據</button></div>
 <p class="muted">自動清理於開啟 APP、切回 APP 或雲端同步後執行；APP 關閉時不會背景執行。維修、專案與樣品共用保留期限。</p>
 <div class="line"></div><h3>回收桶（${rows.length} 筆）</h3>
 ${rows.map(t=>`<div class="item-row"><b>${esc(t.number)}</b> <span class="muted">${esc(t.deleteReason||'已刪除')}</span><p class="muted">${esc(t.institution||'')}｜刪除：${esc(t.deletedAt||'日期不明')}</p><p class="muted">${t.numberReusable?'此單號可重新使用':'此單號不可沿用'}${state.hjTrashMonths&&hjTrashExpiry(t)?'｜預計清理：'+hjTrashExpiry(t).toLocaleDateString('zh-TW'):''}</p><div class="row" style="gap:8px;flex-wrap:wrap"><button type="button" class="btn outline small" onclick="${kind==='repair'?'detail':'projectDetail'}('${t.id}')">查看原單據</button><button type="button" class="btn danger small" onclick="hjTrashManualPurge('${t.id}','${kind}')">永久刪除</button></div></div>`).join('')||'<p class="muted">回收桶目前沒有單據</p>'}`);
}
